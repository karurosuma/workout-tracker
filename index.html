<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=overlays-content" />
  <title>workout-tracker</title>
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#2a2208" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="Workout" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=240" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=240" />
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png?v=240" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=240" />
  <link rel="apple-touch-icon-precomposed" sizes="180x180" href="apple-touch-icon.png?v=240" />
  <link rel="stylesheet" href="vendor/bootstrap-icons.min.css" />
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("./sw.js").catch(function () {});
      });
    }
  </script>
  <style>
    :root {
      --bg: #3a2e08;
      --bg-deep: #2a2208;
      --card: rgba(28, 28, 30, 0.62);
      --field: rgba(44, 44, 46, 0.78);
      --text: #fff;
      --muted: #aeaeb2;
      --accent: #ffd60a;
      --bg-top: #8a6c16;
      --bg-mid: #4a380c;
      --bg-bot: #2a2208;
      --bar: rgba(58, 46, 8, 0.55);
      --line: rgba(255, 255, 255, 0.12);
      --danger: #ff453a;
      --tab-h: 58px;
      --tab-gap: max(12px, calc(env(safe-area-inset-bottom, 0px) - 16px));
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      width: 100%;
      background-color: var(--bg-bot);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "PingFang TC", system-ui, sans-serif;
      overflow: hidden;
      overscroll-behavior: none;
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      -webkit-font-smoothing: antialiased;
    }
    html::before {
      content: "";
      position: fixed;
      z-index: 0;
      left: 0;
      right: 0;
      top: calc(-1 * env(safe-area-inset-top, 0px) - 20px);
      bottom: calc(-1 * env(safe-area-inset-bottom, 0px) - 80px);
      opacity: 0.99;
      pointer-events: none;
      background-color: var(--bg-bot);
      background-image: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 42%, var(--bg-bot) 100%);
    }
    button, input, select { font-family: inherit; font-size: 16px; }
    button { cursor: pointer; }
    button:active { transform: scale(0.97); }
    ul, ol { margin: 0; padding: 0; list-style: none; }
    .top {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: calc(48px + env(safe-area-inset-top));
      padding-top: env(safe-area-inset-top);
      display: flex; align-items: flex-end; justify-content: center;
      padding-bottom: 8px;
      background: rgba(42, 34, 8, 0.55);
      backdrop-filter: saturate(180%) blur(28px);
      -webkit-backdrop-filter: saturate(180%) blur(28px);
      border-bottom: 0.5px solid rgba(255, 255, 255, 0.08);
      z-index: 40;
    }
    .top h1 { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: -0.02em; }
    .top-save {
      position: absolute;
      right: 8px;
      bottom: 4px;
      width: 40px;
      height: 36px;
      border: 0;
      background: transparent;
      color: var(--accent);
      font-size: 20px;
      padding: 0;
    }
    .pages {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      max-width: 480px;
      margin: 0 auto;
      overflow-y: auto;
      overscroll-behavior: none;
      -webkit-overflow-scrolling: touch;
      padding: calc(56px + env(safe-area-inset-top)) 16px calc(var(--tab-h) + var(--tab-gap) + 16px);
      z-index: 1;
      background: transparent;
    }
    .page { display: none; }
    .page.active { display: block; }
    .hidden { display: none !important; }
    .sheet {
      position: fixed; inset: 0; z-index: 60;
      background: rgba(0, 0, 0, 0.5);
      display: flex; align-items: flex-start; justify-content: center;
      padding: calc(64px + env(safe-area-inset-top)) 12px 12px;
    }
    .sheet-card {
      width: min(448px, 100%);
      background: #1c1c1e;
      border-radius: 22px;
      padding: 16px;
      border: 0.5px solid rgba(255,255,255,0.14);
      max-height: 80dvh;
      overflow-y: auto;
    }
    .sheet-card h2 { margin: 0 0 12px; font-size: 20px; }
    .card {
      background: var(--card);
      backdrop-filter: saturate(160%) blur(24px);
      -webkit-backdrop-filter: saturate(160%) blur(24px);
      border-radius: 22px;
      padding: 16px;
      margin-bottom: 12px;
      border: 0.5px solid rgba(255, 255, 255, 0.14);
      box-shadow: inset 0 0.5px 0 rgba(255, 255, 255, 0.16);
      max-width: 100%;
      min-width: 0;
    }
    label { display: block; font-size: 13px; color: var(--muted); margin: 0 0 6px; font-weight: 560; }
    input, select {
      display: block;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      background: var(--field);
      color: var(--text);
      border: 0.5px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 12px 14px;
      margin: 0 0 12px;
    }
    input[type="date"] {
      display: block;
      width: 100%;
      max-width: 100%;
      min-width: 0 !important;
      box-sizing: border-box;
      -webkit-appearance: none;
      appearance: none;
    }
    input[type="date"]::-webkit-date-and-time-value { text-align: center; min-width: 0; }
    input[type="date"]::-webkit-datetime-edit { min-width: 0; padding: 0; text-align: center; width: 100%; }
    input[type="date"]::-webkit-datetime-edit-fields-wrapper { display: flex; justify-content: center; width: 100%; }
    input[type="date"], #perfDate, #recDate, #editDate { text-align: center; }
    .row { display: flex; gap: 8px; align-items: center; width: 100%; min-width: 0; max-width: 100%; margin-bottom: 12px; }
    .row > input { flex: 1 1 0; width: 0; margin: 0; min-width: 0; max-width: 100%; }
    .row > select { flex: 1 1 0; width: 0; margin: 0; min-width: 0; max-width: 100%; }
    .row > input[type="date"] { flex: 1 1 0; width: 0 !important; min-width: 0 !important; max-width: 100% !important; margin: 0; }
    .row .seg { flex: 0 0 132px; margin: 0; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--accent);
      color: #000;
      border: 0; border-radius: 16px;
      padding: 14px 16px; font-weight: 650;
      width: 100%;
      box-shadow: inset 0 0.5px 0 rgba(255, 255, 255, 0.55);
    }
    .btn-ghost { background: rgba(44, 44, 46, 0.85); color: var(--text); box-shadow: none; }
    .btn-danger { background: var(--danger); color: #fff; box-shadow: none; }
    .seg {
      display: flex;
      background: rgba(44, 44, 46, 0.72);
      border-radius: 12px;
      padding: 3px;
      margin-bottom: 12px;
      border: 0.5px solid rgba(255, 255, 255, 0.1);
    }
    .seg button { flex: 1; background: transparent; color: var(--muted); border: 0; border-radius: 9px; padding: 8px 6px; font-weight: 650; }
    .seg button.active { background: var(--accent); color: #000; }
    .suggest-wrap { position: relative; }
    .ex-row { display: flex; gap: 8px; align-items: flex-start; }
    .ex-row .suggest-wrap { flex: 1; min-width: 0; }
    .ex-clear {
      flex: 0 0 46px;
      width: 46px;
      height: 46px;
      margin: 0 0 12px;
      border: 0.5px solid rgba(255,255,255,0.16);
      border-radius: 14px;
      background: rgba(44, 44, 46, 0.85);
      color: #d1d1d6;
      font-size: 22px;
      line-height: 1;
      padding: 0;
    }
    .suggest {
      position: absolute; left: 0; right: 0; top: calc(100% - 8px);
      background: #2c2c2e; border: 0.5px solid rgba(255,255,255,0.16);
      border-radius: 14px; z-index: 30; max-height: 196px; overflow-y: auto;
      box-shadow: 0 10px 28px rgba(0,0,0,0.4);
    }
    .suggest button {
      display: block; width: 100%; text-align: left;
      background: transparent; color: var(--text); border: 0;
      border-bottom: 0.5px solid rgba(255,255,255,0.08);
      padding: 11px 14px; border-radius: 0;
    }
    .suggest button:last-child { border-bottom: 0; }
    .chip {
      background: rgba(44, 44, 46, 0.75);
      color: var(--text);
      border: 0.5px solid rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      padding: 7px 14px;
      font-size: 14px;
    }
    #chips { display: flex; flex-wrap: wrap; gap: 10px; margin: 6px 2px 12px; }
    .badge-new {
      display: inline-block;
      margin-left: 6px;
      padding: 1px 6px;
      border-radius: 999px;
      background: var(--accent);
      color: #000;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.03em;
      vertical-align: 1px;
    }
    #saveBtn { background: #30d158; color: #fff; border: 0; }
    .file-btn { position: relative; margin-bottom: 8px; }
    .file-btn .btn { margin: 0; pointer-events: none; }
    .file-btn input[type="file"] {
      position: absolute; inset: 0; width: 100%; height: 100%;
      margin: 0; opacity: 0.02; font-size: 16px; z-index: 2;
    }
    body::after {
      content: "";
      position: fixed;
      left: 0; right: 0; bottom: 0;
      height: var(--tab-gap);
      background: var(--bg-bot);
      z-index: 35;
      pointer-events: none;
    }
    .tabs {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      width: min(448px, calc(100% - 20px));
      bottom: var(--tab-gap);
      height: var(--tab-h);
      display: flex;
      align-items: stretch;
      gap: 2px;
      padding: 4px;
      background: var(--bar);
      backdrop-filter: saturate(180%) blur(32px);
      -webkit-backdrop-filter: saturate(180%) blur(32px);
      border: 0.5px solid color-mix(in srgb, var(--accent) 45%, transparent);
      border-radius: 29px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.28), inset 0 0.5px 0 rgba(255, 255, 255, 0.28);
      z-index: 40;
    }
    .tabs button {
      flex: 1;
      height: auto;
      background: transparent;
      color: #d1d1d6;
      border: 0;
      padding: 2px 2px 1px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      font-size: 10px;
      font-weight: 650;
      line-height: 1;
      border-radius: 24px;
    }
    .tabs button i { font-size: 20px; line-height: 1; }
    .tabs button.active { color: #000; background: var(--accent); }
    .set { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 0.5px solid var(--line); }
    .set:last-child { border-bottom: 0; }
    .set .btn-ghost { width: auto; padding: 8px 12px; border-radius: 10px; border: 0.5px solid rgba(255,255,255,0.16); }
    .set .icon-btn {
      width: 36px;
      min-width: 36px;
      height: 36px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }
    .ex-group { border-bottom: 0.5px solid var(--line); }
    .ex-group:last-child { border-bottom: 0; }
    .ex-toggle {
      display: flex;
      width: 100%;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 10px 0 2px;
      margin: 0;
      background: transparent;
      border: 0;
      color: inherit;
      text-align: left;
    }
    .ex-meta { display: inline-flex; align-items: center; gap: 8px; }
    .ex-chevron {
      width: 8px;
      height: 8px;
      flex: 0 0 auto;
      border-right: 2px solid var(--muted);
      border-bottom: 2px solid var(--muted);
      transform: rotate(45deg);
    }
    .ex-group.open .ex-chevron { transform: rotate(-135deg); margin-top: 4px; }
    .ex-stat { display: block; text-align: left; padding: 1px 0 1px; }
    .ex-stats { display: flex; align-items: center; justify-content: flex-start; gap: 16px; padding: 2px 0 8px; }
    .ex-stats .cmp-val { display: inline-flex; align-items: center; gap: 4px; margin: 0; width: auto; text-align: left; }
    .ex-stats .cmp-val i { font-size: 14px; line-height: 1; }
    .ex-body { display: none; }
    .ex-group.open .ex-body { display: block; }
    .muted { color: var(--muted); font-size: 13px; }
    .body-tabs {
      display: flex;
      width: 100%;
      gap: 0;
      background: rgba(44, 44, 46, 0.8);
      border-radius: 12px;
      padding: 3px;
      margin: 0 0 12px;
    }
    .body-tabs .nav-item { flex: 1 1 0; display: flex; min-width: 0; }
    .body-tabs .nav-link {
      flex: 1;
      width: 100%;
      display: block;
      text-align: center;
      background: transparent;
      color: var(--muted);
      border: 0;
      border-radius: 9px;
      padding: 8px 4px;
      font-weight: 650;
    }
    .body-tabs .nav-link.active { background: var(--accent); color: #000; }
    .body-figure {
      position: relative;
      width: min(100%, 280px);
      margin: 0 auto;
      min-height: 80px;
    }
    .spin {
      width: 28px;
      height: 28px;
      margin: 48px auto;
      border: 3px solid rgba(255,255,255,0.18);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .body-svg { width: 100%; height: auto; display: block; overflow: hidden; }
    .body-svg.is-off { display: none !important; }
    .body-region { stroke: none; pointer-events: none; fill: #8e8e93; fill-opacity: 0.92; }
    .body-region.hot { fill-opacity: 0.8; }
    .tab-pane { display: none !important; }
    .tab-pane.active { display: block !important; }
    .body-map, .body-col, .body-stage { position: relative; width: 100%; max-width: 100%; }
    .body-region.hot { fill-opacity: 0.78; }
    .swatches { display: flex; gap: 14px; align-items: center; margin: 0 0 16px; }
    .swatches button {
      width: 36px; height: 36px; border-radius: 50%;
      border: 2px solid transparent; padding: 0; flex: none;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.25);
    }
    .swatches button[data-theme="red"] { background: #ff453a; }
    .swatches button[data-theme="green"] { background: #30d158; }
    .swatches button[data-theme="yellow"] { background: #ffd60a; }
    .swatches button[data-theme="blue"] { background: #0a84ff; }
    .swatches button[data-theme="orange"] { background: #ff9f0a; }
    .swatches button.active { border-color: #fff; box-shadow: 0 0 0 3px rgba(255,255,255,0.35); }
    .chip.on { background: var(--accent); color: #000; }
    .cmp-table { width: 100%; border-collapse: collapse; }
    .cmp-table td { padding: 10px 0; border-bottom: 0.5px solid var(--line); vertical-align: middle; }
    .cmp-table tr:last-child td { border-bottom: 0; }
    .cmp-table td:first-child { font-weight: 650; }
    .cmp-table td:last-child { text-align: right; }
    .cmp-val {
      display: block; margin-left: auto; width: auto;
      background: transparent; border: 0; padding: 2px 0;
      color: var(--accent); font-weight: 650; text-align: right;
    }
    .cmp-val.up { color: #30d158; }
    .cmp-val.down { color: #ff453a; }
    .body-lines { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .body-pct {
      position: absolute;
      width: 76px;
      padding: 4px 6px;
      border-radius: 8px;
      background: rgba(28, 28, 30, 0.9);
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      text-align: center;
      line-height: 1.15;
    }
    .body-pct b, .body-pct small { display: block; }
    .body-pct small { font-size: 10px; font-weight: 600; margin-top: 1px; }
    .body-pct[data-side="left"] { left: 0; }
    .body-pct[data-side="right"] { right: 0; }
    .section-head { margin: 8px 4px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .section-head h2 { margin: 0; font-size: 20px; font-weight: 700; }
    .fold summary { cursor: pointer; list-style: none; }
    .fold summary::-webkit-details-marker { display: none; }
    .fold summary::after {
      content: "";
      width: 8px;
      height: 8px;
      border-right: 2px solid var(--muted);
      border-bottom: 2px solid var(--muted);
      transform: rotate(45deg);
    }
    .fold[open] summary::after { transform: rotate(-135deg); margin-top: 6px; }
    .link-btn {
      width: auto;
      border: 0;
      background: transparent;
      color: var(--accent);
      font-weight: 650;
      font-size: 14px;
      padding: 4px 0;
    }
    #perfDays {
      display: flex;
      flex-wrap: nowrap;
      gap: 8px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      margin: 0 0 12px;
    }
    #perfDays::-webkit-scrollbar { display: none; }
    #perfDays .chip { flex: 0 0 auto; }
    .toast {
      position: fixed;
      left: 50%;
      top: calc(62px + env(safe-area-inset-top));
      transform: translateX(-50%);
      z-index: 80;
      max-width: calc(100% - 32px);
      background: rgba(28, 28, 30, 0.94);
      color: #fff;
      border: 0.5px solid rgba(255,255,255,0.16);
      border-radius: 14px;
      padding: 10px 16px;
      font-weight: 650;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }
    #chartRange, #chartMode { flex-wrap: wrap; }
    #chartRange button { flex: 1 1 18%; min-width: 56px; }
    #chartMode button { flex: 1; min-width: 0; padding-left: 4px; padding-right: 4px; }
    .chart-title { font-weight: 650; margin-bottom: 8px; }
    .muscle-table { width: 100%; border-collapse: collapse; }
    .muscle-table td { padding: 8px 0; border-bottom: 0.5px solid var(--line); }
    .muscle-table tr:last-child td { border-bottom: 0; }
    .muscle-table td:last-child { text-align: right; color: var(--accent); font-weight: 650; }
    .muscle-row { cursor: pointer; }
    .muscle-row.open td:first-child { color: var(--accent); }
    .muscle-detail td { text-align: left !important; color: var(--text) !important; font-weight: 500; padding-top: 0; }
    .muscle-ex { display: flex; justify-content: space-between; gap: 8px; padding: 4px 0 4px 10px; color: var(--muted); font-size: 13px; font-weight: 550; }
    .muscle-ex b { color: var(--text); font-weight: 650; }

  </style>
</head>
<body>
  <header class="top"><h1 id="title">記錄</h1><button type="button" class="top-save" id="titleSave" aria-label="Save"><i class="bi bi-floppy"></i></button></header>
  <main class="pages">
    <section class="page active" id="page-log">
      <div class="seg" id="logMode">
        <button type="button" class="active" data-mode="add">新增</button>
        <button type="button" data-mode="list">從清單</button>
      </div>
      <div id="pane-add">
        <div class="card">
          <label data-i18n-key="date">訓練日期</label>
          <input id="sessionDate" type="date" />
          <label data-i18n-key="exercise">動作</label>
          <div class="ex-row">
            <div class="suggest-wrap">
              <input id="exercise" list="exerciseList" placeholder="臥推" autocomplete="off" />
              <div id="exerciseSuggest" class="suggest hidden"></div>
            </div>
            <button type="button" class="ex-clear" id="clearExercise" aria-label="Clear">×</button>
          </div>
          <datalist id="exerciseList"></datalist>
          <label><span data-i18n="weight">重量</span> <span class="muted" id="lastWeightHint"></span></label>
          <div class="row">
            <input id="weight" inputmode="decimal" placeholder="60" />
            <div class="seg" id="unitSeg" style="margin:0">
              <button type="button" class="active" data-unit="kg">kg</button>
              <button type="button" data-unit="lbs">lbs</button>
            </div>
          </div>
          <label data-i18n-key="reps">次數</label>
          <input id="reps" inputmode="numeric" placeholder="8" />
          <button type="button" class="btn" id="addBtn">新增組數</button>
        </div>
        <div class="muted" data-i18n-key="recent" style="margin-bottom:8px">常用動作</div>
        <div class="chips" id="chips"></div>
      </div>
      <div id="pane-list" class="hidden">
        <div class="card" id="fromList"></div>
      </div>
      <div class="card" style="margin-top:16px">
        <div class="muted" data-i18n-key="log" style="margin-bottom:8px">訓練日誌</div>
        <div id="logList"></div>
      </div>
    </section>
    <section class="page" id="page-perf">
      <div class="card" id="perfBodyMap"><section class="card-panel p-3 mb-4" id="perfBodyMapInner">
          <ul class="nav nav-pills body-tabs mb-3" id="perfBodyTabs" role="tablist">
            <li class="nav-item" role="presentation">
              <button class="nav-link active" id="perf-body-front-btn" data-bs-toggle="pill" data-bs-target="#perf-body-front" type="button" role="tab" aria-controls="perf-body-front" aria-selected="true" data-i18n="bodyFront">正面</button>

      function layoutBodyLines(root) {

        scope.querySelectorAll(".body-stage").forEach(function (stage) {

          svg.setAttribute("viewBox", "0 0 " + sr.width + " " + sr.height);
          svg.innerHTML = "";
          var regions = {};
          art.querySelectorAll(".body-region").forEach(function (node) {
            var id = node.getAttribute("data-part");
            var r = node.getBoundingClientRect();
            if (!r.width || !r.height) return;
            var box = { left: r.left - sr.left, right: r.right - sr.left, top: r.top - sr.top, bottom: r.bottom - sr.top };
            if (!regions[id]) regions[id] = [];
            regions[id].push(box);
          });

            var id = label.getAttribute("data-part");
            var boxes = regions[id];
            if (!boxes) return;
            var side = label.getAttribute("data-side") === "left" ? "left" : "right";
            var cy = 0;
            boxes.forEach(function (b) { cy += (b.top + b.bottom) / 2; });
            sides[side].push({ label: label, id: id, y: cy / boxes.length });
          });
          ["left", "right"].forEach(function (side) {
            var items = sides[side].sort(function (a, b) { return a.y - b.y; });
            var gap = 58;
            for (var i = 1; i < items.length; i++) {

            }
            var last = items[items.length - 1];
            if (last && last.y > sr.height - 24) {
              var shift = last.y - (sr.height - 24);
              for (var j = items.length - 1; j >= 0; j--) {
                items[j].y -= shift;
                if (j > 0 && items[j].y - items[j - 1].y < gap) items[j - 1].y = items[j].y - gap;
              }
            }
            items.forEach(function (item) { item.label.style.top = item.y + "px"; });
          });
          stage.querySelectorAll(".body-pct").forEach(function (label) {

            if (!boxes) return;
            var lr = label.getBoundingClientRect();

            var lx = onLeft ? (lr.right - sr.left) : (lr.left - sr.left);
            var ly = lr.top - sr.top + lr.height / 2;

            path.setAttribute("stroke", label.classList.contains("on") ? "rgba(255,255,255,0.72)" : "#6d6d72");

    function renderCharts() {
      if (typeof ApexCharts === "undefined") {
        var host = document.getElementById("charts");
        if (host && !document.getElementById("chartSpin")) host.insertAdjacentHTML("afterbegin", '<div class="spin" id="chartSpin"></div>');
        loadScript("vendor/apexcharts.min.js").then(function () { renderCharts(); }).catch(function () {
          var spin = document.getElementById("chartSpin");
          if (spin) spin.remove();
        });
        return;
      }
      var spin = document.getElementById("chartSpin");
      if (spin) spin.remove();
      var sets = loadSets().filter(function (s) { return inRange(s.date); });
      renderMuscleTable(sets);
      var el = document.getElementById("charts");
      clearCharts();
      var by = {};
      sets.forEach(function (s) {
        var k = s.exercise;
        by[k] = by[k] || [];
        by[k].push(s);
      });
      var names = Object.keys(by).sort();
      var head = document.getElementById("chartsHead");
      if (head) head.textContent = t(chartMode === "volume" ? "volume" : chartMode === "sets" ? "setsChart" : "bestWeight");
      if (!names.length) { el.innerHTML = "<div class=\"card\"><div class=\"muted\">" + t("noData") + "</div></div>"; return; }
      el.innerHTML = names.map(function (n, i) {
        return "<div class=\"card\"><div class=\"chart-title\">" + escapeHtml(n) + "</div><div id=\"chart-" + i + "\"></div></div>";
      }).join("");
      names.forEach(function (n, i) {
        var pts = by[n].slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; });
        var keys;
        var values;
        if (chartMode === "weight") {
          var best = {};
          pts.forEach(function (s) { best[s.date] = Math.max(best[s.date] || 0, Number(s.weight) || 0); });
          keys = Object.keys(best).sort();
          values = keys.map(function (d) { return Math.round(fromKg(best[d]) * 10) / 10; });
        } else if (chartMode === "sets") {
          var counts = {};
          pts.forEach(function (s) { counts[s.date] = (counts[s.date] || 0) + 1; });
          keys = Object.keys(counts).sort();
          values = keys.map(function (d) { return counts[d]; });
        } else {
          var vol = {};
          pts.forEach(function (s) { vol[s.date] = (vol[s.date] || 0) + (Number(s.weight) || 0) * (Number(s.reps) || 0); });
          keys = Object.keys(vol).sort();
          values = keys.map(function (d) { return Math.round(fromKg(vol[d]) * 10) / 10; });
        }
        var node = document.getElementById("chart-" + i);
        if (!node || typeof ApexCharts === "undefined") return;
        var accent = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#ffd60a";
        var chart = new ApexCharts(node, {
          chart: { type: "area", height: 220, animations: { enabled: false }, background: "transparent", toolbar: { show: false } },
          theme: { mode: "dark" },
          series: [{ name: n, data: values }],
          xaxis: {
            type: "category",
            categories: keys,
            labels: { rotate: -45, hideOverlappingLabels: true }
          },
          colors: [accent],
          stroke: { width: 2, curve: "straight" },
          markers: { size: 4, strokeWidth: 0 },
          fill: {
            type: "gradient",
            gradient: { shade: "dark", type: "vertical", shadeIntensity: 0.5, opacityFrom: 0.55, opacityTo: 0.02, stops: [0, 92, 100] }
          },
          dataLabels: { enabled: false },
          tooltip: { intersect: true, shared: false },
          grid: { borderColor: "rgba(255,255,255,0.08)" }
        });
        chart.render();
        chartList.push(chart);
      });
    }

      if (input) input.click();
    });
    function exportData() {
      flushSql();
      if (fileKind === "json") {
        downloadBlob(new Blob([JSON.stringify(loadSets(), null, 2)], { type: "application/json" }), "workout.json");
        notify(t("saved"));
        return;
      }
      if (!sqlDb) return;
      downloadBlob(new Blob([sqlDb.export()], { type: "application/x-sqlite3" }), "workout.sqlite");
      notify(t("saved"));
    }
    bind("saveBtn", "click", exportData);
    bind("titleSave", "click", exportData);
    bind("importFile", "change", function (e) {
      var input = e.target;
      var file = input.files && input.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        var buf = reader.result;
        var bytes = new Uint8Array(buf);
        var head = "";
        for (var i = 0; i < 15 && i < bytes.length; i++) head += String.fromCharCode(bytes[i]);
        var name = (file.name || "").toLowerCase();
        var sqlite = head === "SQLite format 3" || /\.(sqlite3?|db)$/.test(name);
        var finish = function () { input.value = ""; };
        var fail = function () { finish(); notify(t("loadFail")); };
        if (sqlite || (fileKind === "sqlite" && !name.endsWith(".json"))) {
          initSql().then(function () {
            if (!SQL_LIB) return fail();
            try {
              sqlDb = new SQL_LIB.Database(bytes);
              ensureSchema();
              memoryStore.sets = rowsFromSql();
              persistSql();
              render();
              notify(t("loaded"));
              finish();
            } catch (err) { fail(); }
          }).catch(fail);
          return;
        }
        try {
          var data = JSON.parse(new TextDecoder().decode(bytes));
          var rows = Array.isArray(data) ? data : (data.sets || []);
          saveSets(rows);
          render();
          notify(t("loaded"));
          finish();
        } catch (err) { fail(); }
      };
      reader.onerror = function () { input.value = ""; notify(t("loadFail")); };
      reader.readAsArrayBuffer(file);
    });
    function refreshApp() {
      notify(t("updating"));
      var done = function () { location.reload(); };
      var update = navigator.serviceWorker ? navigator.serviceWorker.getRegistration().then(function (reg) {
        return reg ? reg.update() : null;
      }) : Promise.resolve();
      update.then(done).catch(done);
    }
    bind("updateBtn", "click", refreshApp);
    fetch("muscles.json").then(function (r) { return r.json(); }).then(function (data) {
      if (data && (data.exercises || data.keywords)) MUSCLE_DATA = data;
    }).catch(function () {});
    setInterval(function () {
      document.querySelectorAll("[data-ago]").forEach(function (el) {
        el.textContent = timeAgo(el.getAttribute("data-ago"));
      });
    }, 15000);
    applyGender();
    applyTheme();
    applyFileKind();
    setUnit(unit);
    applyLang();
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "hidden") flushSql();
    });
    window.addEventListener("pagehide", flushSql);
    initSql().then(function () { render(); }).catch(function () { hideBoot(); render(); });
  })();
  </script>
</body>
</html>
