<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>workout-tracker-web-app — 訓練紀錄</title>
  <meta name="theme-color" content="#0b0f14" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Workout" />
  <meta name="application-name" content="workout-tracker-web-app" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <style>
    :root {
      --bg: #0b0f14;
      --panel: #131a22;
      --panel-2: #18212b;
      --line: #243140;
      --text: #e8eef5;
      --muted: #8b9bb0;
      --accent: #3dff9a;
      --accent-2: #2bd4ff;
      --danger: #ff5d73;
      --warn: #ffc857;
    }

    * { box-sizing: border-box; }

    body {
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(61, 255, 154, 0.08), transparent 50%),
        radial-gradient(900px 500px at 100% 0%, rgba(43, 212, 255, 0.07), transparent 45%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Segoe UI", system-ui, sans-serif;
    }

    .navbar {
      background: transparent;
      border-bottom: 0;
    }

    .card-panel {
      background: linear-gradient(180deg, var(--panel), var(--panel-2));
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.28);
    }

    .form-control, .form-select {
      background: #0e151c;
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: 12px;
    }

    .form-control:focus, .form-select:focus {
      background: #0e151c;
      color: var(--text);
      border-color: var(--accent);
      box-shadow: 0 0 0 0.2rem rgba(61, 255, 154, 0.15);
    }

    .form-control::placeholder { color: #6d7d90; }

    .input-group-text {
      background: #0e151c;
      border: 1px solid var(--line);
      color: var(--muted);
    }

    .btn-accent {
      background: linear-gradient(135deg, var(--accent), #21e08a);
      border: 0;
      color: #06110b;
      font-weight: 700;
      border-radius: 12px;
    }

    .btn-accent:hover { filter: brightness(1.05); color: #06110b; }

    .btn-ghost {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: 12px;
    }

    .btn-ghost:hover {
      background: #1b2733;
      color: var(--text);
    }

    .lang-switch {
      display: inline-flex;
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
    }

    .lang-switch button {
      border: 0;
      background: transparent;
      color: var(--muted);
      min-height: 34px;
      padding: 0 12px;
      font-weight: 700;
    }

    .lang-switch button.active {
      background: #0e151c;
      color: var(--accent);
    }

    .stat {
      background: #0e151c;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px 16px;
    }

    .stat-value {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--line);
      background: #101820;
      color: var(--muted);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 0.82rem;
      cursor: pointer;
    }

    .chip:hover, .chip.active {
      border-color: var(--accent);
      color: var(--accent);
    }

    .set-row {
      background: #0e151c;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 14px;
    }

    .empty-state {
      border: 1px dashed var(--line);
      border-radius: 16px;
      padding: 36px 20px;
      text-align: center;
      color: var(--muted);
    }

    .text-muted-2 { color: var(--muted) !important; }

    .badge-soft {
      background: rgba(61, 255, 154, 0.12);
      color: var(--accent);
      border: 1px solid rgba(61, 255, 154, 0.22);
    }

    .modal-content {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 18px;
    }

    .modal-header, .modal-footer { border-color: var(--line); }

    .btn-close { filter: invert(1); }

    .form-status {
      display: none;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 0.92rem;
    }

    .form-status.show { display: block; }
    .form-status.ok { background: rgba(61, 255, 154, 0.12); color: var(--accent); }
    .form-status.err { background: rgba(255, 93, 115, 0.14); color: #ff8a9a; }
    .form-status.warn { background: rgba(255, 200, 87, 0.14); color: var(--warn); }

    .welcome-overlay {
      position: fixed;
      inset: 0;
      z-index: 2000;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(6, 10, 14, 0.9);
      backdrop-filter: blur(12px);
    }

    .welcome-overlay.hidden { display: none; }

    .welcome-card {
      width: min(420px, 100%);
      background: linear-gradient(180deg, var(--panel), var(--panel-2));
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 28px 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    }

    .welcome-card .btn { min-height: 44px; }

    .page-author {
      text-align: center;
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.02em;
      padding: 8px 16px 28px;
    }

    .page-author a {
      color: var(--muted);
      text-decoration: none;
    }

    .page-author a:hover {
      color: var(--accent);
    }

    .chart-card {
      background: #0e151c;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px 12px 8px;
      margin-bottom: 12px;
    }

    .chart-card h3 {
      font-size: 0.95rem;
      font-weight: 700;
      margin: 0 0 4px;
    }

    .chart-mount { min-height: 220px; }

    .app-tabs {
      border-bottom: 1px solid var(--line);
    }

    .app-tabs .nav-link {
      color: var(--muted);
      background: transparent;
      border: 0;
      border-bottom: 2px solid transparent;
      border-radius: 0;
      min-height: 44px;
      padding: 10px 16px;
      font-weight: 600;
    }

    .app-tabs .nav-link:hover { color: var(--text); }

    .app-tabs .nav-link.active {
      color: var(--accent);
      background: transparent;
      border-bottom-color: var(--accent);
    }

    .unit-btn {
      cursor: pointer;
      min-width: 52px;
    }

    .unit-btn.active {
      color: var(--accent);
      border-color: var(--accent);
    }

    body.welcome-lock { overflow: hidden; }

    @media (max-width: 767.98px) {
      .stat-value { font-size: 1.15rem; }
    }
  </style>
</head>
<body>
  <div id="welcomeOverlay" class="welcome-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="welcomeTitle">
    <div class="welcome-card">
      <div class="d-flex justify-content-end mb-3">
        <div class="lang-switch" role="group">
          <button type="button" id="overlayLangZh" class="active">繁</button>
          <button type="button" id="overlayLangEn">EN</button>
        </div>
      </div>
      <h2 class="h4 mb-2" id="welcomeTitle" data-i18n="welcomeTitle">第一次開啟</h2>
      <p class="text-muted-2 mb-4" data-i18n="welcomeBody">請先開啟備份檔載入紀錄，或略過後從空白開始。</p>
      <div class="d-grid gap-2">
        <button class="btn btn-accent" id="welcomeOpenBtn" type="button">
          <i class="bi bi-folder2-open me-1"></i><span data-i18n="welcomeOpen">開啟檔案</span>
        </button>
        <button class="btn btn-ghost" id="welcomeSkipBtn" type="button" data-i18n="welcomeSkip">略過，繼續</button>
      </div>
    </div>
  </div>

  <nav class="navbar py-3">
    <div class="container d-flex align-items-center justify-content-end gap-2">
      <div class="d-flex flex-wrap gap-2 justify-content-end">
        <div class="lang-switch" role="group" aria-label="語言">
          <button type="button" id="langZh" class="active">繁</button>
          <button type="button" id="langEn">EN</button>
        </div>
        <div class="lang-switch" role="group" aria-label="單位">
          <button type="button" id="unitKg" class="active">kg</button>
          <button type="button" id="unitLbs">lbs</button>
        </div>
        <button class="btn btn-ghost btn-sm" id="saveBtn" type="button">
          <i class="bi bi-download me-1"></i><span data-i18n="save">匯出</span>
        </button>
        <button class="btn btn-ghost btn-sm" id="loadBtn" type="button">
          <i class="bi bi-folder2-open me-1"></i><span data-i18n="load">匯入</span>
        </button>
        <button class="btn btn-ghost btn-sm" id="clearAllBtn" type="button">
          <i class="bi bi-trash3 me-1"></i><span data-i18n="clear">清除</span>
        </button>
        <input id="loadFile" type="file" accept=".json,application/json,text/plain,.csv,text/csv" hidden />
      </div>
    </div>
  </nav>

  <main class="container py-4 py-md-5">
    <div class="row g-3 mb-4">
      <div class="col-4">
        <div class="stat">
          <div class="small text-muted-2" data-i18n="setsToday">今日組數</div>
          <div class="stat-value" id="statSets">0</div>
        </div>
      </div>
      <div class="col-4">
        <div class="stat">
          <div class="small text-muted-2" data-i18n="volume">總容量</div>
          <div class="stat-value" id="statVolume">0</div>
        </div>
      </div>
      <div class="col-4">
        <div class="stat">
          <div class="small text-muted-2" data-i18n="exercises">動作數</div>
          <div class="stat-value" id="statExercises">0</div>
        </div>
      </div>
    </div>

    <ul class="nav app-tabs mb-4" id="appTabs" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="tab-log-btn" data-bs-toggle="tab" data-bs-target="#tab-log" type="button" role="tab" aria-controls="tab-log" aria-selected="true" data-i18n="tabLog">記錄</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="tab-history-btn" data-bs-toggle="tab" data-bs-target="#tab-history" type="button" role="tab" aria-controls="tab-history" aria-selected="false" data-i18n="tabHistory">日誌</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="tab-charts-btn" data-bs-toggle="tab" data-bs-target="#tab-charts" type="button" role="tab" aria-controls="tab-charts" aria-selected="false" data-i18n="tabCharts">圖表</button>
      </li>
    </ul>

    <div class="tab-content">
      <div class="tab-pane fade show active" id="tab-log" role="tabpanel" aria-labelledby="tab-log-btn" tabindex="0">
        <section class="card-panel p-4">
          <div class="d-flex justify-content-between align-items-start mb-3">
            <div>
              <h1 class="h4 mb-1" data-i18n="logTitle">記錄一組</h1>
              <p class="mb-0 text-muted-2" data-i18n="logSubtitle">追蹤動作、重量與次數。</p>
            </div>
            <span class="badge badge-soft" id="todayBadge">今天</span>
          </div>

          <div id="formStatus" class="form-status mb-3" role="status"></div>

          <form id="setForm" class="row g-3" novalidate>
            <div class="col-12">
              <label class="form-label" for="exercise" data-i18n="exercise">動作</label>
              <input class="form-control" id="exercise" name="exercise" list="exerciseList" placeholder="臥推" autocomplete="off" required />
              <datalist id="exerciseList"></datalist>
            </div>
            <div class="col-12">
              <label class="form-label" for="weight" data-i18n="weight">重量</label>
              <div class="input-group">
                <input class="form-control" id="weight" name="weight" type="text" inputmode="decimal" placeholder="60" required />
                <button class="input-group-text unit-btn" id="formUnitKg" type="button">kg</button>
                <button class="input-group-text unit-btn" id="formUnitLbs" type="button">lbs</button>
              </div>
            </div>
            <div class="col-12">
              <label class="form-label" for="reps" data-i18n="reps">次數</label>
              <input class="form-control" id="reps" name="reps" type="text" inputmode="numeric" placeholder="8" required />
            </div>
            <div class="col-12">
              <label class="form-label" for="sessionDate" data-i18n="sessionDate">訓練日期</label>
              <input class="form-control" id="sessionDate" name="sessionDate" type="date" required />
            </div>
            <div class="col-12 d-grid">
              <button class="btn btn-accent py-2" id="addSetBtn" type="submit">
                <i class="bi bi-plus-lg me-1"></i><span data-i18n="addSet">新增組數</span>
              </button>
            </div>
          </form>

          <div class="mt-4">
            <div class="small text-muted-2 mb-2" data-i18n="recentExercises">常用動作</div>
            <div id="exerciseChips" class="d-flex flex-wrap gap-2"></div>
          </div>
        </section>
      </div>

      <div class="tab-pane fade" id="tab-history" role="tabpanel" aria-labelledby="tab-history-btn" tabindex="0">
        <section class="card-panel p-4">
          <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
            <h2 class="h5 mb-0" data-i18n="workoutLog">訓練日誌</h2>
            <select class="form-select form-select-sm w-auto" id="filterDate">
              <option value="all">全部訓練</option>
            </select>
          </div>
          <div id="logList"></div>
        </section>
      </div>

      <div class="tab-pane fade" id="tab-charts" role="tabpanel" aria-labelledby="tab-charts-btn" tabindex="0">
        <section class="card-panel p-4">
          <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
            <h2 class="h5 mb-0" data-i18n="chartsTitle">動作進度</h2>
            <span class="small text-muted-2" data-i18n="chartsHint">每個動作的最高重量與訓練容量</span>
          </div>
          <div id="chartsList"></div>
        </section>
      </div>
    </div>
  </main>

  <footer class="page-author">
    <a href="https://github.com/karurosuma/workout-tracker" target="_blank" rel="noopener noreferrer">@karurosuma/workout-tracker</a>
  </footer>

  <div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title h5" data-i18n="editSet">編輯組數</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="editForm">
          <div class="modal-body">
            <input type="hidden" id="editId" />
            <div class="mb-3">
              <label class="form-label" for="editExercise" data-i18n="exercise">動作</label>
              <input class="form-control" id="editExercise" required />
            </div>
            <div class="mb-3">
              <label class="form-label" for="editWeight"><span data-i18n="weight">重量</span></label>
              <div class="input-group">
                <input class="form-control" id="editWeight" type="text" inputmode="decimal" required />
                <span class="input-group-text" id="editWeightUnit">公斤</span>
              </div>
            </div>
            <div>
              <label class="form-label" for="editReps" data-i18n="reps">次數</label>
              <input class="form-control" id="editReps" type="text" inputmode="numeric" required />
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-ghost" data-bs-dismiss="modal" data-i18n="cancel">取消</button>
            <button type="submit" class="btn btn-accent" data-i18n="saveChanges">儲存變更</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>

      var locale = "zh-Hant";
      var unit = "kg";
      var form = document.getElementById("setForm");
      var editForm = document.getElementById("editForm");
      var logList = document.getElementById("logList");
      var filterDate = document.getElementById("filterDate");
      var exerciseList = document.getElementById("exerciseList");
      var exerciseChips = document.getElementById("exerciseChips");
      var statusEl = document.getElementById("formStatus");
      var loadFile = document.getElementById("loadFile");
      var memoryStore = { sets: [] };
      var persistWarningShown = false;
      var chartInstances = [];

      function t(key, vars) {
        var pack = I18N[locale] || I18N["zh-Hant"];
        var text = pack[key] != null ? pack[key] : key;
        if (vars) {
          Object.keys(vars).forEach(function (name) {
            text = text.split("{" + name + "}").join(String(vars[name]));
          });
        }
        return text;
      }

      function dateLocaleName() {
        return locale === "zh-Hant" ? "zh-Hant" : "en";
      }

      function round1(value) {
        return Math.round(Number(value) * 10) / 10;
      }

      function unitLabel() {
        return unit === "lbs" ? t("lbs") : t("kg");
      }

      function fromKg(kgValue) {
        return unit === "lbs" ? Number(kgValue) * KG_TO_LBS : Number(kgValue);
      }

      function toKg(entered) {
        return unit === "lbs" ? Number(entered) / KG_TO_LBS : Number(entered);
      }

      function formatWeight(kgValue) {
        return String(round1(fromKg(kgValue)));
      }

      function formatVolume(kgVolume) {
        return round1(fromKg(kgVolume)).toLocaleString(dateLocaleName());
      }

      function storageRead(key, legacyKey) {
        try {
          var value = localStorage.getItem(key);
          if (value != null) return value;
          value = localStorage.getItem(legacyKey);
          if (value != null) {
            localStorage.setItem(key, value);
            return value;
          }
        } catch (err) {}
        return null;
      }

      function detectUnit() {
        var saved = storageRead(UNIT_KEY, LEGACY_UNIT_KEY);
        if (saved === "lbs" || saved === "kg") return saved;
        return "kg";
      }

      function convertOpenInputs(from, to) {
        if (from === to) return;
        ["weight", "editWeight"].forEach(function (id) {
          var el = document.getElementById(id);
          if (!el || !String(el.value).trim()) return;
          var value = parseNumber(el.value);
          if (!isFinite(value)) return;
          var kg = from === "lbs" ? value / KG_TO_LBS : value;
          var shown = to === "lbs" ? kg * KG_TO_LBS : kg;
          el.value = String(round1(shown));
        });
      }

      function setUnit(next) {
        var prev = unit;
        unit = next === "lbs" ? "lbs" : "kg";
        try { localStorage.setItem(UNIT_KEY, unit); } catch (err) {}
        convertOpenInputs(prev, unit);
        applyStaticI18n();
        render();
      }

      function detectLocale() {
        var saved = storageRead(LOCALE_KEY, LEGACY_LOCALE_KEY);
        if (saved === "en" || saved === "zh-Hant") return saved;
        var lang = String(navigator.language || "").toLowerCase();
        if (lang.indexOf("en") === 0) return "en";
        return "zh-Hant";
      }

      function setLocale(code) {
        locale = code === "en" ? "en" : "zh-Hant";
        try { localStorage.setItem(LOCALE_KEY, locale); } catch (err) {}
        applyStaticI18n();
        render();
      }

      function applyStaticI18n() {
        document.documentElement.lang = locale === "zh-Hant" ? "zh-Hant" : "en";
        document.title = t("brand") + " — " + t("tagline");
        var appleTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]');
        if (appleTitle) appleTitle.setAttribute("content", t("tagline"));
        document.querySelectorAll("[data-i18n]").forEach(function (el) {
          el.textContent = t(el.getAttribute("data-i18n"));
        });
        document.getElementById("exercise").setAttribute("placeholder", t("exercisePlaceholder"));
        document.querySelector(".lang-switch").setAttribute("aria-label", t("language"));
        document.getElementById("unitKg").parentNode.setAttribute("aria-label", t("units"));
        document.getElementById("langZh").classList.toggle("active", locale === "zh-Hant");
        document.getElementById("langEn").classList.toggle("active", locale === "en");
        document.getElementById("overlayLangZh").classList.toggle("active", locale === "zh-Hant");
        document.getElementById("overlayLangEn").classList.toggle("active", locale === "en");
        document.getElementById("unitKg").classList.toggle("active", unit === "kg");
        document.getElementById("unitLbs").classList.toggle("active", unit === "lbs");
        document.getElementById("formUnitKg").classList.toggle("active", unit === "kg");
        document.getElementById("formUnitLbs").classList.toggle("active", unit === "lbs");
        document.getElementById("formUnitKg").textContent = t("kg");
        document.getElementById("formUnitLbs").textContent = t("lbs");
        document.getElementById("editWeightUnit").textContent = unitLabel();
        document.getElementById("todayBadge").textContent = new Date().toLocaleDateString(dateLocaleName(), {
          weekday: "short", month: "short", day: "numeric"
        });
      }

      function getModal() {
        try {
          if (window.bootstrap && bootstrap.Modal) {
            return bootstrap.Modal.getOrCreateInstance(document.getElementById("editModal"));
          }
        } catch (err) {}
        return {
          show: function () { alert(t("editOnline")); },
          hide: function () {}
        };
      }

      function todayISO() {
        var now = new Date();
        var offset = now.getTimezoneOffset() * 60000;
        return new Date(now.getTime() - offset).toISOString().slice(0, 10);
      }

      function showStatus(type, message) {
        statusEl.className = "form-status mb-3 show " + type;
        statusEl.textContent = message;
      }

      function parseNumber(value) {
        return Number(String(value).trim().replace(",", "."));
      }

      function uid() {
        try {
          if (crypto && crypto.randomUUID) return crypto.randomUUID();
        } catch (err) {}
        return String(Date.now()) + "-" + Math.random().toString(16).slice(2);
      }

      function loadSets() {
        try {
          var raw = storageRead(STORAGE_KEY, LEGACY_STORAGE_KEY);
          if (raw) {
            var parsed = JSON.parse(raw);
            if (Array.isArray(parsed)) {
              memoryStore.sets = parsed;
              return parsed.slice();
            }
          }
        } catch (err) {
          if (!persistWarningShown) {
            persistWarningShown = true;
            showStatus("warn", t("persistWarn"));
          }
        }
        return memoryStore.sets.slice();
      }

      function saveSets(sets) {
        memoryStore.sets = sets.slice();
        try {
          var payload = JSON.stringify(sets);
          localStorage.setItem(STORAGE_KEY, payload);
          if (localStorage.getItem(STORAGE_KEY) !== payload) throw new Error("storage verify failed");
          return true;
        } catch (err) {
          showStatus("warn", t("tabOnly"));
          return false;
        }
      }

      function normalizeSet(raw, index) {
        if (!raw || typeof raw !== "object") return null;
        var exercise = String(raw.exercise || raw.name || raw.Exercise || "").trim();
        var weight = parseNumber(raw.weight != null ? raw.weight : raw.Weight);
        var reps = parseNumber(raw.reps != null ? raw.reps : raw.Reps);
        var date = String(raw.date || raw.Date || todayISO()).slice(0, 10);
        if (!exercise || !isFinite(weight) || weight < 0 || !isFinite(reps) || reps < 1) return null;
        return {
          id: String(raw.id || uid() + "-" + index),
          exercise: exercise,
          weight: weight,
          reps: Math.floor(reps),
          date: /^\d{4}-\d{2}-\d{2}$/.test(date) ? date : todayISO(),
          createdAt: Number(raw.createdAt) || Date.now() + index
        };
      }

      function parseBackup(text) {
        var trimmed = String(text || "").replace(/^\uFEFF/, "").trim();
        if (!trimmed) throw new Error("emptyFile");

        if (trimmed.charAt(0) === "{" || trimmed.charAt(0) === "[") {
          var data = JSON.parse(trimmed);
          var rows = Array.isArray(data) ? data : (data.sets || data.records || data.data);
          if (!Array.isArray(rows)) throw new Error("noSetList");
          return rows.map(normalizeSet).filter(Boolean);
        }

        var lines = trimmed.split(/\r?\n/).filter(function (line) { return line.trim(); });
        if (!lines.length) throw new Error("emptyFile");
        var header = lines[0].split(",").map(function (cell) {
          return cell.trim().replace(/^"|"$/g, "").toLowerCase();
        });
        var idx = {
          exercise: header.indexOf("exercise"),
          weight: header.indexOf("weight"),
          reps: header.indexOf("reps"),
          date: header.indexOf("date")
        };
        if (idx.exercise === -1 || idx.weight === -1 || idx.reps === -1) {
          throw new Error("csvNeed");
        }
        return lines.slice(1).map(function (line, index) {
          var cells = line.split(",").map(function (cell) {
            return cell.trim().replace(/^"|"$/g, "");
          });
          return normalizeSet({
            exercise: cells[idx.exercise],
            weight: cells[idx.weight],
            reps: cells[idx.reps],
            date: idx.date >= 0 ? cells[idx.date] : todayISO()
          }, index);
        }).filter(Boolean);
      }

      function backupFilename() {
        return "workout-tracker-web-app-" + todayISO() + ".json";
      }

      function backupPayload() {
        return JSON.stringify({
          app: "workout-tracker-web-app",
          version: 1,
          weightUnit: "kg",
          exportedAt: new Date().toISOString(),
          sets: loadSets()
        }, null, 2);
      }

      async function exportBackup() {
        var sets = loadSets();
        if (!sets.length) {
          showStatus("err", t("nothingToSave"));
          return;
        }
        var text = backupPayload();
        var filename = backupFilename();
        var blob = new Blob([text], { type: "application/json" });
        var file = new File([blob], filename, { type: "application/json" });

        try {
          if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({
              files: [file],
              title: "workout-tracker-web-app",
              text: sets.length + " " + t("sets")
            });
            showStatus("ok", t("savedShare", { count: sets.length }));
            return;
          }
        } catch (err) {
          if (err && err.name === "AbortError") return;
        }

        try {
          var url = URL.createObjectURL(blob);
          var link = document.createElement("a");
          link.href = url;
          link.download = filename;
          link.rel = "noopener";
          document.body.appendChild(link);
          link.click();
          link.remove();
          setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
          showStatus("ok", t("exported", { count: sets.length, filename: filename }));
        } catch (err) {
          try {
            await navigator.clipboard.writeText(text);
            showStatus("ok", t("copied"));
          } catch (clipErr) {
            showStatus("err", t("exportFail"));
          }
        }
      }

      function importBackupText(text) {
        var incoming = parseBackup(text);
        if (!incoming.length) throw new Error("noValidSets");
        var current = loadSets();
        if (current.length) {
          var replace = confirm(t("loadReplace", { incoming: incoming.length, current: current.length }));
          if (replace) {
            saveSets(incoming);
            showStatus("ok", t("loaded", { count: incoming.length }));
          } else {
            var seen = {};
            current.forEach(function (set) { seen[set.id] = true; });
            var merged = current.slice();
            incoming.forEach(function (set) {
              if (seen[set.id]) set.id = uid();
              merged.push(set);
            });
            saveSets(merged);
            showStatus("ok", t("merged", { incoming: incoming.length, total: merged.length }));
          }
        } else {
          saveSets(incoming);
          showStatus("ok", t("loaded", { count: incoming.length }));
        }
        render();
      }

      function uniqueExercises(sets) {
        var seen = [];
        for (var i = 0; i < sets.length; i++) {
          var name = String(sets[i].exercise || "").trim();
          if (name && !seen.some(function (item) { return item.toLowerCase() === name.toLowerCase(); })) {
            seen.push(name);
          }
        }
        return seen.sort(function (a, b) { return a.localeCompare(b, dateLocaleName()); });
      }

      function formatDateLabel(iso) {
        if (iso === todayISO()) return t("today");
        return new Date(iso + "T00:00:00").toLocaleDateString(dateLocaleName(), {
          weekday: "short", month: "short", day: "numeric"
        });
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "\u0026amp;")
          .replace(/</g, "\u0026lt;")
          .replace(/>/g, "\u0026gt;")
          .replace(/"/g, "\u0026quot;");
      }

      function exerciseProgress(sets) {
        var byName = {};
        sets.forEach(function (set) {
          var name = String(set.exercise || "").trim();
          if (!name) return;
          var key = name.toLowerCase();
          if (!byName[key]) byName[key] = { name: name, days: {} };
          var day = byName[key].days[set.date] || { weight: 0, volume: 0, sets: 0 };
          day.weight = Math.max(day.weight, Number(set.weight) || 0);
          day.volume += (Number(set.weight) || 0) * (Number(set.reps) || 0);
          day.sets += 1;
          byName[key].days[set.date] = day;
        });
        return Object.keys(byName).sort(function (a, b) {
          return byName[a].name.localeCompare(byName[b].name, dateLocaleName());
        }).map(function (key) {
          var item = byName[key];
          var dates = Object.keys(item.days).sort();
          return {
            name: item.name,
            dates: dates,
            labels: dates.map(formatDateLabel),
            weights: dates.map(function (d) { return item.days[d].weight; }),
            volumes: dates.map(function (d) { return item.days[d].volume; })
          };
        });
      }

      function destroyCharts() {
        chartInstances.forEach(function (chart) {
          try { chart.destroy(); } catch (err) {}
        });
        chartInstances = [];
      }

      function chartOptions(series) {
        return {
          chart: {
            type: "line",
            height: 240,
            background: "transparent",
            toolbar: { show: false },
            zoom: { enabled: false },
            fontFamily: "Noto Sans TC, PingFang TC, Microsoft JhengHei, Segoe UI, sans-serif",
            animations: { enabled: true, speed: 400 }
          },
          theme: { mode: "dark" },
          colors: ["#3dff9a", "#2bd4ff"],
          stroke: { width: [3, 2], curve: "smooth" },
          markers: { size: 4, strokeWidth: 0 },
          dataLabels: { enabled: false },
          grid: { borderColor: "#243140", strokeDashArray: 4 },
          legend: { labels: { colors: "#8b9bb0" } },
          xaxis: {
            categories: series.labels,
            labels: { style: { colors: "#8b9bb0" }, rotateAlways: false },
            axisBorder: { color: "#243140" },
            axisTicks: { color: "#243140" }
          },
          yaxis: [
            {
              title: { text: t("chartWeight") + " (" + unitLabel() + ")", style: { color: "#8b9bb0" } },
              labels: { style: { colors: "#8b9bb0" } }
            },
            {
              opposite: true,
              title: { text: t("chartVolume"), style: { color: "#8b9bb0" } },
              labels: { style: { colors: "#8b9bb0" } }
            }
          ],
          tooltip: { theme: "dark", shared: true },
          series: [
            { name: t("chartWeight"), type: "line", data: series.weights.map(function (kg) { return round1(fromKg(kg)); }) },
            { name: t("chartVolume"), type: "area", data: series.volumes.map(function (kgVol) { return round1(fromKg(kgVol)); }) }
          ]
        };
      }

      function renderCharts(sets) {
        var list = document.getElementById("chartsList");
        destroyCharts();
        var progress = exerciseProgress(sets);
        if (!progress.length) {
          list.innerHTML = "<div class=\"empty-state\">" + escapeHtml(t("chartsEmpty")) + "</div>";
          return;
        }
        if (typeof ApexCharts === "undefined") {
          list.innerHTML = "<div class=\"empty-state\">" + escapeHtml(t("chartsFail")) + "</div>";
          return;
        }
        list.innerHTML = progress.map(function (item, index) {
          return "<div class=\"chart-card\"><h3>" + escapeHtml(item.name) + "</h3><div class=\"chart-mount\" id=\"chart-" + index + "\"></div></div>";
        }).join("");
        progress.forEach(function (item, index) {
          var chart = new ApexCharts(document.getElementById("chart-" + index), chartOptions(item));
          chart.render();
          chartInstances.push(chart);
        });
      }
      function render() {
        var sets = loadSets().sort(function (a, b) {
          if (a.date === b.date) return (b.createdAt || 0) - (a.createdAt || 0);
          return a.date < b.date ? 1 : -1;
        });

        var todaySets = sets.filter(function (set) { return set.date === todayISO(); });
        var volume = todaySets.reduce(function (sum, set) {
          return sum + (Number(set.weight) * Number(set.reps));
        }, 0);
        var exercisesToday = {};
        todaySets.forEach(function (set) { exercisesToday[String(set.exercise).toLowerCase()] = true; });

        document.getElementById("statSets").textContent = String(todaySets.length);
        document.getElementById("statVolume").textContent = formatVolume(volume);
        document.getElementById("statExercises").textContent = String(Object.keys(exercisesToday).length);

        var names = uniqueExercises(sets);
        exerciseList.innerHTML = names.map(function (name) {
          return "<option value=\"" + escapeHtml(name) + "\"></option>";
        }).join("");
        exerciseChips.innerHTML = names.slice(0, 8).map(function (name) {
          return "<button type=\"button\" class=\"chip\" data-exercise=\"" + escapeHtml(name) + "\">" + escapeHtml(name) + "</button>";
        }).join("") || "<span class=\"text-muted-2 small\">" + escapeHtml(t("noRecent")) + "</span>";

        var dates = [];
        sets.forEach(function (set) {
          if (dates.indexOf(set.date) === -1) dates.push(set.date);
        });
        var currentFilter = filterDate.value || "all";
        filterDate.innerHTML = "<option value=\"all\">" + escapeHtml(t("allSessions")) + "</option>" +
          dates.map(function (date) {
            return "<option value=\"" + date + "\">" + escapeHtml(formatDateLabel(date)) + "</option>";
          }).join("");
        filterDate.value = dates.indexOf(currentFilter) !== -1 || currentFilter === "all" ? currentFilter : "all";

        var visible = filterDate.value === "all" ? sets : sets.filter(function (set) {
          return set.date === filterDate.value;
        });

        if (!visible.length) {
          logList.innerHTML = "<div class=\"empty-state\"><i class=\"bi bi-activity fs-2 d-block mb-2\"></i>" + escapeHtml(t("emptyLog")) + "</div>";
        } else {
        var grouped = {};
        visible.forEach(function (set) {
          (grouped[set.date] || (grouped[set.date] = [])).push(set);
        });

        logList.innerHTML = Object.keys(grouped).map(function (date) {
          var rows = grouped[date].map(function (set) {
            return "<div class=\"set-row d-flex justify-content-between align-items-center gap-3 mb-2\">" +
              "<div><div class=\"fw-semibold\">" + escapeHtml(set.exercise) + "</div>" +
              "<div class=\"small text-muted-2\">" + formatWeight(set.weight) + " " + escapeHtml(unitLabel()) + " × " + set.reps + " " + escapeHtml(t("reps")) + " · " +
              formatVolume(Number(set.weight) * Number(set.reps)) + " " + escapeHtml(t("vol")) + "</div></div>" +
              "<div class=\"btn-group\">" +
                "<button class=\"btn btn-ghost btn-sm\" data-edit=\"" + set.id + "\" type=\"button\" aria-label=\"" + escapeHtml(t("editSet")) + "\"><i class=\"bi bi-pencil\"></i></button>" +
                "<button class=\"btn btn-ghost btn-sm text-danger\" data-delete=\"" + set.id + "\" type=\"button\" aria-label=\"" + escapeHtml(t("clear")) + "\"><i class=\"bi bi-x-lg\"></i></button>" +
              "</div></div>";
          }).join("");

          var sessionVolume = grouped[date].reduce(function (sum, set) {
            return sum + Number(set.weight) * Number(set.reps);
          }, 0);
          return "<div class=\"mb-4\"><div class=\"d-flex justify-content-between align-items-center mb-2\">" +
            "<strong>" + escapeHtml(formatDateLabel(date)) + "</strong>" +
            "<span class=\"small text-muted-2\">" + grouped[date].length + " " + escapeHtml(t("sets")) + " · " + formatVolume(sessionVolume) + " " + escapeHtml(t("vol")) + "</span>" +
            "</div>" + rows + "</div>";
        }).join("");
        }

        renderCharts(sets);
      }

      document.getElementById("sessionDate").value = todayISO();

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        var exercise = document.getElementById("exercise").value.trim();
        var enteredWeight = parseNumber(document.getElementById("weight").value);
        var weight = toKg(enteredWeight);
        var reps = parseNumber(document.getElementById("reps").value);
        var date = document.getElementById("sessionDate").value || todayISO();

        if (!exercise) {
          showStatus("err", t("needExercise"));
          document.getElementById("exercise").focus();
          return;
        }
        if (!isFinite(enteredWeight) || enteredWeight < 0) {
          showStatus("err", t("needWeight"));
          document.getElementById("weight").focus();
          return;
        }
        if (!isFinite(reps) || reps < 1 || Math.floor(reps) !== reps) {
          showStatus("err", t("needReps"));
          document.getElementById("reps").focus();
          return;
        }

        var sets = loadSets();
        sets.push({
          id: uid(),
          exercise: exercise,
          weight: weight,
          reps: reps,
          date: date,
          createdAt: Date.now()
        });
        var persisted = saveSets(sets);
        document.getElementById("weight").value = "";
        document.getElementById("reps").value = "";
        document.getElementById("sessionDate").value = date;
        if (persisted) {
          showStatus("ok", t("logged", { exercise: exercise, weight: round1(enteredWeight), reps: reps, unit: unitLabel() }));
        }
        render();
        document.getElementById("reps").focus();
      });

      exerciseChips.addEventListener("click", function (event) {
        var button = event.target.closest("[data-exercise]");
        if (!button) return;
        document.getElementById("exercise").value = button.getAttribute("data-exercise");
        document.getElementById("weight").focus();
      });

      logList.addEventListener("click", function (event) {
        var deleteBtn = event.target.closest("[data-delete]");
        var editBtn = event.target.closest("[data-edit]");
        var sets = loadSets();

        if (deleteBtn) {
          saveSets(sets.filter(function (set) {
            return set.id !== deleteBtn.getAttribute("data-delete");
          }));
          render();
          return;
        }

        if (editBtn) {
          var set = sets.filter(function (item) {
            return item.id === editBtn.getAttribute("data-edit");
          })[0];
          if (!set) return;
          document.getElementById("editId").value = set.id;
          document.getElementById("editExercise").value = set.exercise;
          document.getElementById("editWeight").value = formatWeight(set.weight);
          document.getElementById("editReps").value = set.reps;
          getModal().show();
        }
      });

      editForm.addEventListener("submit", function (event) {
        event.preventDefault();
        var id = document.getElementById("editId").value;
        var enteredWeight = parseNumber(document.getElementById("editWeight").value);
        var weight = toKg(enteredWeight);
        var reps = parseNumber(document.getElementById("editReps").value);
        var exercise = document.getElementById("editExercise").value.trim();
        if (!exercise || !isFinite(enteredWeight) || enteredWeight < 0 || !isFinite(reps) || reps < 1) {
          alert(t("invalidEdit"));
          return;
        }
        var sets = loadSets().map(function (set) {
          if (set.id !== id) return set;
          return { id: set.id, exercise: exercise, weight: weight, reps: reps, date: set.date, createdAt: set.createdAt };
        });
        saveSets(sets);
        getModal().hide();
        render();
      });

      filterDate.addEventListener("change", render);

      document.getElementById("saveBtn").addEventListener("click", function () {
        exportBackup();
      });

      document.getElementById("loadBtn").addEventListener("click", function () {
        loadFile.value = "";
        loadFile.click();
      });

      loadFile.addEventListener("change", function (event) {
        var file = event.target.files && event.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function () {
          try {
            importBackupText(String(reader.result || ""));
          } catch (err) {
            var code = err && err.message;
            showStatus("err", t(code) !== code ? t(code) : t("readFail"));
          }
        };
        reader.onerror = function () {
          showStatus("err", t("openFail"));
        };
        reader.readAsText(file);
      });

      document.getElementById("clearAllBtn").addEventListener("click", function () {
        if (!loadSets().length) return;
        if (confirm(t("clearConfirm"))) {
          saveSets([]);
          render();
        }
      });

      document.getElementById("langZh").addEventListener("click", function () { setLocale("zh-Hant"); });
      document.getElementById("langEn").addEventListener("click", function () { setLocale("en"); });
      document.getElementById("overlayLangZh").addEventListener("click", function () { setLocale("zh-Hant"); });
      document.getElementById("overlayLangEn").addEventListener("click", function () { setLocale("en"); });
      document.getElementById("unitKg").addEventListener("click", function () { setUnit("kg"); });
      document.getElementById("unitLbs").addEventListener("click", function () { setUnit("lbs"); });
      document.getElementById("formUnitKg").addEventListener("click", function () { setUnit("kg"); });
      document.getElementById("formUnitLbs").addEventListener("click", function () { setUnit("lbs"); });

      document.getElementById("tab-charts-btn").addEventListener("shown.bs.tab", function () {
        renderCharts(loadSets());
      });
      document.getElementById("appTabs").addEventListener("click", function (event) {
        var btn = event.target.closest("[data-bs-target]");
        if (!btn || window.bootstrap) return;
        var target = document.querySelector(btn.getAttribute("data-bs-target"));
        if (!target) return;
        document.querySelectorAll("#appTabs .nav-link").forEach(function (link) {
          link.classList.toggle("active", link === btn);
          link.setAttribute("aria-selected", link === btn ? "true" : "false");
        });
        document.querySelectorAll(".tab-pane").forEach(function (pane) {
          var on = pane === target;
          pane.classList.toggle("show", on);
          pane.classList.toggle("active", on);
        });
        if (target.id === "tab-charts") renderCharts(loadSets());
      });

      function hasMadeFirstChoice() {
        return storageRead(FIRST_OPEN_KEY, LEGACY_FIRST_OPEN_KEY) === "1";
      }

      function markFirstChoice() {
        try { localStorage.setItem(FIRST_OPEN_KEY, "1"); } catch (err) {}
      }

      function hideWelcome() {
        document.getElementById("welcomeOverlay").classList.add("hidden");
        document.body.classList.remove("welcome-lock");
      }

      function showWelcome() {
        document.getElementById("welcomeOverlay").classList.remove("hidden");
        document.body.classList.add("welcome-lock");
      }

      document.getElementById("welcomeOpenBtn").addEventListener("click", function () {
        markFirstChoice();
        hideWelcome();
        loadFile.value = "";
        loadFile.click();
      });

      document.getElementById("welcomeSkipBtn").addEventListener("click", function () {
        markFirstChoice();
        hideWelcome();
      });

      unit = detectUnit();
      setLocale(detectLocale());
      if (!hasMadeFirstChoice()) showWelcome();

      if (window.location.protocol !== "file:" && "serviceWorker" in navigator) {
        navigator.serviceWorker.register("./sw.js").catch(function () {});
      }
    })();
  </script>
</body>
</html>
