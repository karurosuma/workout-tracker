<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=overlays-content" />
  <title>workout-tracker-web-app — 訓練紀錄</title>
  <meta name="theme-color" content="#0b0f14" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0f14" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#0b0f14" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Workout" />
  <meta name="application-name" content="workout-tracker-web-app" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <style>
    :root {
      --bg: #0b0f14;
      --panel: #131a22;
      --panel-2: #18212b;
      --line: #243140;
      --text: #e8eef5;
      --muted: #8b9bb0;
      --accent: #3dff9a;
      --accent-2: #2bd4ff;
      --danger: #ff5d73;
      --warn: #ffc857;
      --nav-h: 72px;
    }

    * { box-sizing: border-box; }

    html {
      background-color: var(--bg);
      background-image:
        radial-gradient(1200px 600px at 10% -10%, rgba(61, 255, 154, 0.08), transparent 50%),
        radial-gradient(900px 500px at 100% 0%, rgba(43, 212, 255, 0.07), transparent 45%);
      background-attachment: fixed;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
    }

    body {
      background-color: transparent;
      color: var(--text);
      height: 100%;
      height: 100dvh;
      max-height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Segoe UI", system-ui, sans-serif;
      padding-top: 0;
      padding-right: env(safe-area-inset-right, 0px);
      padding-bottom: 0;
      padding-left: env(safe-area-inset-left, 0px);
    }

    .status-spacer {
      flex: 0 0 auto;
      height: env(safe-area-inset-top, 0px);
      background: transparent;
    }

    .app-scroll {
      flex: 1 1 auto;
      min-height: 0;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .app-nav-bar {
      position: relative !important;
      left: auto;
      right: auto;
      bottom: auto !important;
      top: auto !important;
      flex: 0 0 auto;
      width: 100%;
      background: var(--bg);
      border-top: 1px solid var(--line);
      border-bottom: 0;
      z-index: 1030;
      padding-top: 0;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    .app-nav-bar .container {
      padding-top: 0;
      padding-bottom: 0;
    }

    body.keyboard-open .app-nav-bar {
      display: none;
    }

    .card-panel {
      background: linear-gradient(180deg, var(--panel), var(--panel-2));
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.28);
    }

    .section-head {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
    }

    .section-head-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px 12px;
      width: 100%;
    }

    .form-control, .form-select {
      background: #0e151c;
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: 12px;
    }

    .form-control:focus, .form-select:focus {
      background: #0e151c;
      color: var(--text);
      border-color: var(--accent);
      box-shadow: 0 0 0 0.2rem rgba(61, 255, 154, 0.15);
    }

    .form-control::placeholder { color: #6d7d90; }

    .input-group-text {
      background: #0e151c;
      border: 1px solid var(--line);
      color: var(--muted);
    }

    .btn-accent {
      background: linear-gradient(135deg, var(--accent), #21e08a);
      border: 0;
      color: #06110b;
      font-weight: 700;
      border-radius: 12px;
      transition: transform 0.2s ease, filter 0.2s ease, box-shadow 0.2s ease;
    }

    #addSetBtn .add-set-done { display: none; }
    #addSetBtn.is-success .add-set-idle { display: none; }
    #addSetBtn.is-success .add-set-done { display: inline-flex; align-items: center; justify-content: center; }
    #addSetBtn.is-success {
      filter: brightness(1.1);
      box-shadow: 0 0 0 3px rgba(61, 255, 154, 0.35);
      animation: addSetPulse 0.45s ease;
    }
    #addSetBtn.is-success .bi-check-lg {
      display: inline-block;
      animation: checkPop 0.45s ease;
    }
    @keyframes checkPop {
      0% { transform: scale(0.3) rotate(-20deg); opacity: 0; }
      60% { transform: scale(1.3) rotate(0deg); opacity: 1; }
      100% { transform: scale(1) rotate(0deg); }
    }
    @keyframes addSetPulse {
      0% { transform: scale(1); }
      40% { transform: scale(1.04); }
      100% { transform: scale(1); }
    }

    .btn-danger-app {
      background: var(--danger);
      border: 0;
      color: #fff;
      font-weight: 700;
      border-radius: 12px;
      min-height: 44px;
    }

    .btn-danger-app:hover { filter: brightness(1.05); color: #fff; }

    .btn-ghost {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: 12px;
    }

    .btn-ghost:hover {
      background: #1b2733;
      color: var(--text);
    }

    .lang-switch {
      display: inline-flex;
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
    }

    .lang-switch button {
      border: 0;
      background: transparent;
      color: var(--muted);
      min-height: 34px;
      padding: 0 12px;
      font-weight: 700;
    }

    .lang-switch button.active {
      background: #0e151c;
      color: var(--accent);
    }

    .stat {
      background: #0e151c;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px 16px;
    }

    .stat-value {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--line);
      background: #101820;
      color: var(--muted);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 0.82rem;
      cursor: pointer;
    }

    .chip:hover, .chip.active {
      border-color: var(--accent);
      color: var(--accent);
    }

    .set-row {
      background: #0e151c;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 14px;
    }

    .summary-row + .summary-row { margin-top: 8px; }

    .delta-pill {
      font-weight: 800;
      font-size: 0.95rem;
      white-space: nowrap;
    }

    .delta-up { color: var(--accent); }
    .delta-down { color: #ff8a9a; }
    .delta-flat { color: var(--muted); }

    .summary-compare {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }

    .summary-compare-cell {
      background: #101820;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 10px;
    }

    .summary-compare-label {
      font-size: 0.72rem;
      color: var(--muted);
      margin-bottom: 2px;
    }

    .summary-compare-value {
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .empty-state {
      border: 1px dashed var(--line);
      border-radius: 16px;
      padding: 36px 20px;
      text-align: center;
      color: var(--muted);
    }

    .text-muted-2 { color: var(--muted) !important; }

    .badge-soft {
      background: rgba(61, 255, 154, 0.12);
      color: var(--accent);
      border: 1px solid rgba(61, 255, 154, 0.22);
    }

    .modal-content {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 18px;
    }

    .modal-header, .modal-footer { border-color: var(--line); }

    .btn-close { filter: invert(1); }

    .form-status {
      display: none;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 0.92rem;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .form-status.show { display: flex; }
    .form-status.ok { background: rgba(61, 255, 154, 0.12); color: var(--accent); }
    .form-status.err { background: rgba(255, 93, 115, 0.14); color: #ff8a9a; }
    .form-status.warn { background: rgba(255, 200, 87, 0.14); color: var(--warn); }

    .form-status-close {
      border: 0;
      background: transparent;
      color: inherit;
      font-size: 1.25rem;
      line-height: 1;
      padding: 0 2px;
      min-width: 28px;
      min-height: 28px;
      opacity: 0.7;
    }

    .form-status-close:hover { opacity: 1; }

    .welcome-overlay {
      position: fixed;
      inset: 0;
      z-index: 2000;
      display: grid;
      place-items: center;
      padding: max(24px, env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(24px, env(safe-area-inset-left, 0px));
      background: rgba(6, 10, 14, 0.9);
      backdrop-filter: blur(12px);
    }

    .confirm-overlay {
      z-index: 6000;
    }

    .welcome-overlay.hidden {
      display: none !important;
      pointer-events: none !important;
      visibility: hidden;
    }

    .welcome-card {
      width: min(420px, 100%);
      background: linear-gradient(180deg, var(--panel), var(--panel-2));
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 28px 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    }

    .welcome-card .btn { min-height: 44px; }

    .page-author {
      text-align: center;
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.02em;
      padding: 8px 16px 6px;
    }

    .page-author a {
      color: var(--muted);
      text-decoration: none;
    }

    .page-author a:hover {
      color: var(--accent);
    }

    .chart-card {
      background: #0e151c;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px 12px 8px;
      margin-bottom: 12px;
    }

    .chart-card h3 {
      font-size: 0.95rem;
      font-weight: 700;
      margin: 0 0 4px;
    }

    .chart-mount { min-height: 220px; }

    .chart-range {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .chart-range .form-select,
    .chart-range .form-control {
      min-height: 44px;
    }

    @media (min-width: 576px) {
      .chart-range {
        grid-template-columns: minmax(140px, 1fr) 1fr 1fr;
        align-items: end;
      }
    }

    .app-tabs {
      display: flex;
      flex-wrap: nowrap;
      border-bottom: 0;
      justify-content: stretch;
      gap: 0;
      margin: 0;
    }

    .app-tabs .nav-item {
      flex: 1 1 0;
      min-width: 0;
    }

    .app-tabs .nav-link {
      color: var(--muted);
      background: transparent;
      border: 0;
      border-top: 2px solid transparent;
      border-radius: 0;
      min-height: 48px;
      width: 100%;
      padding: 4px 2px 2px;
      font-weight: 600;
      font-size: 0.72rem;
      line-height: 1.15;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
    }

    .app-tabs .nav-link i {
      font-size: 1.25rem;
      line-height: 1;
    }

    .app-tabs .nav-link:hover { color: var(--text); }

    .app-tabs .nav-link.active {
      color: var(--accent);
      background: transparent;
      border-top-color: var(--accent);
    }

    .settings-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 0;
      border-bottom: 1px solid var(--line);
    }

    .settings-row:last-child { border-bottom: 0; padding-bottom: 0; }

    .settings-row .btn,
    .settings-row .lang-switch button {
      min-height: 44px;
    }

    .settings-actions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      width: 100%;
    }

    @media (min-width: 576px) {
      .settings-actions {
        grid-template-columns: 1fr 1fr 1fr;
        width: auto;
      }
    }

    .unit-btn {
      cursor: pointer;
      min-width: 52px;
    }

    .unit-btn.active {
      color: var(--accent);
      border-color: var(--accent);
    }

    body.welcome-lock { overflow: hidden; }

    @media (max-width: 767.98px) {
      .stat-value { font-size: 1.15rem; }
    }
  </style>
</head>
<body>
  <div id="welcomeOverlay" class="welcome-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="welcomeTitle">
    <div class="welcome-card">
      <div class="d-flex justify-content-end mb-3">
        <div class="lang-switch" role="group">
          <button type="button" id="overlayLangZh" class="active">繁</button>
          <button type="button" id="overlayLangEn">EN</button>
        </div>
      </div>
      <h2 class="h4 mb-2" id="welcomeTitle" data-i18n="welcomeTitle">第一次開啟</h2>
      <p class="text-muted-2 mb-4" data-i18n="welcomeBody">請先開啟備份檔載入紀錄，或略過後從空白開始。</p>
      <div class="d-grid gap-2">
        <button class="btn btn-accent" id="welcomeOpenBtn" type="button">
          <i class="bi bi-folder2-open me-1"></i><span data-i18n="welcomeOpen">開啟檔案</span>
        </button>
        <button class="btn btn-ghost" id="welcomeSkipBtn" type="button" data-i18n="welcomeSkip">略過，繼續</button>
      </div>
    </div>
  </div>

  <div class="status-spacer" aria-hidden="true"></div>

  <div class="app-scroll">
  <main class="container py-4 py-md-5">
    <div id="formStatus" class="form-status mb-3" role="status">
      <span id="formStatusText"></span>
      <button type="button" id="formStatusClose" class="form-status-close" aria-label="關閉">&times;</button>
    </div>

    <div class="tab-content">
      <div class="tab-pane fade" id="tab-today" role="tabpanel" aria-labelledby="tab-today-btn" tabindex="0">
        <div class="section-head mb-3">
          <div class="section-head-top">
            <h1 class="h4 mb-0" data-i18n="todayTitle">今日訓練</h1>
            <input class="form-control form-control-sm w-auto" id="todayDate" type="date" />
          </div>
        </div>
        <div class="row g-3 mb-4">
          <div class="col-4">
            <div class="stat">
              <div class="small text-muted-2" data-i18n="setsToday">今日組數</div>
              <div class="stat-value" id="statSets">0</div>
            </div>
          </div>
          <div class="col-4">
            <div class="stat">
              <div class="small text-muted-2" data-i18n="volume">總容量</div>
              <div class="stat-value" id="statVolume">0</div>
            </div>
          </div>
          <div class="col-4">
            <div class="stat">
              <div class="small text-muted-2" data-i18n="exercises">動作數</div>
              <div class="stat-value" id="statExercises">0</div>
            </div>
          </div>
        </div>
        <div class="section-head mb-2">
          <h2 class="h5 mb-0" data-i18n="todayPieTitle">今日動作</h2>
          <span class="small text-muted-2" data-i18n="todayPieHint">依容量占比</span>
        </div>
        <section class="card-panel p-4 mb-4">
          <div id="todayPieMount" class="chart-mount"></div>
        </section>
        <div class="section-head mb-2">
          <h2 class="h5 mb-0" data-i18n="todaySummaryTitle">動作摘要</h2>
          <span class="small text-muted-2" data-i18n="todaySummaryHint">與上次同動作比較容量</span>
        </div>
        <section class="card-panel p-4 mb-4">
          <div id="todaySummary"></div>
        </section>
        <div class="section-head mb-2">
          <h2 class="h5 mb-0" data-i18n="todayLogTitle">今日組數清單</h2>
        </div>
        <section class="card-panel p-4">
          <div id="todayLog"></div>
        </section>
      </div>

      <div class="tab-pane fade show active" id="tab-log" role="tabpanel" aria-labelledby="tab-log-btn" tabindex="0">
        <div class="section-head mb-2">
          <h1 class="h4 mb-1" data-i18n="logTitle">記錄一組</h1>
          <p class="mb-0 text-muted-2" data-i18n="logSubtitle">追蹤動作、重量與次數。</p>
        </div>
        <section class="card-panel p-4">
          <form id="setForm" class="row g-3" novalidate>
            <div class="col-12">
              <label class="form-label" for="exercise" data-i18n="exercise">動作</label>
              <input class="form-control" id="exercise" name="exercise" list="exerciseList" placeholder="臥推" autocomplete="off" required />
              <datalist id="exerciseList"></datalist>
            </div>
            <div class="col-12">
              <label class="form-label" for="weight" data-i18n="weight">重量</label>
              <div class="input-group">
                <input class="form-control" id="weight" name="weight" type="text" inputmode="decimal" placeholder="60" required />
                <button class="input-group-text unit-btn" id="formUnitKg" type="button">kg</button>
                <button class="input-group-text unit-btn" id="formUnitLbs" type="button">lbs</button>
              </div>
            </div>
            <div class="col-12">
              <label class="form-label" for="reps" data-i18n="reps">次數</label>
              <input class="form-control" id="reps" name="reps" type="text" inputmode="numeric" placeholder="8" required />
            </div>
            <div class="col-12">
              <label class="form-label" for="sessionDate" data-i18n="sessionDate">訓練日期</label>
              <input class="form-control" id="sessionDate" name="sessionDate" type="date" required />
            </div>
            <div class="col-12 d-grid gap-2">
              <button class="btn btn-accent py-2" id="addSetBtn" type="submit">
                <span class="add-set-idle">
                  <i class="bi bi-plus-lg me-1"></i><span data-i18n="addSet">新增組數</span>
                </span>
                <span class="add-set-done">
                  <i class="bi bi-check-lg me-1"></i><span data-i18n="addedSet">已新增</span>
                </span>
              </button>
              <button class="btn btn-ghost py-2" id="lastSetBtn" type="button">
                <i class="bi bi-arrow-repeat me-1"></i><span data-i18n="lastSet">再加上一組</span>
              </button>
            </div>
          </form>

          <div class="mt-4">
            <div class="small text-muted-2 mb-2" data-i18n="recentExercises">常用動作</div>
            <div id="exerciseChips" class="d-flex flex-wrap gap-2"></div>
          </div>
        </section>

        <div class="section-head mb-2 mt-4">
          <div class="section-head-top">
            <h2 class="h5 mb-0" data-i18n="workoutLog">訓練日誌</h2>
            <select class="form-select form-select-sm w-auto" id="filterDate">
              <option value="today" selected data-i18n="today">今天</option>
              <option value="all" data-i18n="allSessions">全部訓練</option>
            </select>
          </div>
        </div>
        <section class="card-panel p-4">
          <div id="logList"></div>
        </section>
      </div>

      <div class="tab-pane fade" id="tab-charts" role="tabpanel" aria-labelledby="tab-charts-btn" tabindex="0">
        <div class="section-head mb-2">
          <h2 class="h5 mb-0" data-i18n="chartsTitle">動作進度</h2>
          <p class="mb-0 small text-muted-2" data-i18n="chartsHint">每個動作的最高重量與訓練容量</p>
        </div>
        <section class="card-panel p-4">
          <div class="chart-range mb-3">
            <select class="form-select" id="chartRangePreset">
              <option value="7" selected data-i18n="range7">近 7 天</option>
              <option value="30" data-i18n="range30">近 30 天</option>
              <option value="90" data-i18n="range90">近 90 天</option>
              <option value="all" data-i18n="rangeAll">全部日期</option>
              <option value="custom" data-i18n="rangeCustom">自訂範圍</option>
            </select>
            <div class="chart-range-dates">
              <label class="form-label mb-1" for="chartFrom" data-i18n="rangeFrom">從</label>
              <input class="form-control" id="chartFrom" type="date" />
            </div>
            <div class="chart-range-dates">
              <label class="form-label mb-1" for="chartTo" data-i18n="rangeTo">到</label>

      function t(key, vars) {
        var pack = I18N[locale] || I18N["zh-Hant"];
        var text = pack[key] != null ? pack[key] : key;
        if (vars) {
          Object.keys(vars).forEach(function (name) {
            text = text.split("{" + name + "}").join(String(vars[name]));
          });
        }
        return text;
      }

      function dateLocaleName() {
        return locale === "zh-Hant" ? "zh-Hant" : "en";
      }

      function round1(value) {
        return Math.round(Number(value) * 10) / 10;
      }

      function unitLabel() {
        return unit === "lbs" ? t("lbs") : t("kg");
      }

      function fromKg(kgValue) {
        return unit === "lbs" ? Number(kgValue) * KG_TO_LBS : Number(kgValue);
      }

      function toKg(entered) {
        return unit === "lbs" ? Number(entered) / KG_TO_LBS : Number(entered);
      }

      function formatWeight(kgValue) {
        return String(round1(fromKg(kgValue)));
      }

      function formatVolume(kgVolume) {
        return round1(fromKg(kgVolume)).toLocaleString(dateLocaleName());
      }

      function storageRead(key, legacyKey) {
        try {
          var value = localStorage.getItem(key);
          if (value != null) return value;
          value = localStorage.getItem(legacyKey);
          if (value != null) {
            localStorage.setItem(key, value);
            return value;
          }
        } catch (err) {}
        return null;
      }

      function detectUnit() {
        var saved = storageRead(UNIT_KEY, LEGACY_UNIT_KEY);
        if (saved === "lbs" || saved === "kg") return saved;
        return "kg";
      }

      function convertOpenInputs(from, to) {
        if (from === to) return;
        ["weight", "editWeight"].forEach(function (id) {
          var el = document.getElementById(id);
          if (!el || !String(el.value).trim()) return;
          var value = parseNumber(el.value);
          if (!isFinite(value)) return;
          var kg = from === "lbs" ? value / KG_TO_LBS : value;
          var shown = to === "lbs" ? kg * KG_TO_LBS : kg;
          el.value = String(round1(shown));
        });
      }

      function setUnit(next) {
        var prev = unit;
        unit = next === "lbs" ? "lbs" : "kg";
        try { localStorage.setItem(UNIT_KEY, unit); } catch (err) {}
        convertOpenInputs(prev, unit);
        applyStaticI18n();
        render();
      }

      function detectLocale() {
        var saved = storageRead(LOCALE_KEY, LEGACY_LOCALE_KEY);
        if (saved === "en" || saved === "zh-Hant") return saved;
        var lang = String(navigator.language || "").toLowerCase();
        if (lang.indexOf("en") === 0) return "en";
        return "zh-Hant";
      }

      function setLocale(code) {
        locale = code === "en" ? "en" : "zh-Hant";
        try { localStorage.setItem(LOCALE_KEY, locale); } catch (err) {}
        applyStaticI18n();
        render();

      function applyStaticI18n() {

        document.getElementById("unitKg").parentNode.setAttribute("aria-label", t("units"));

        document.getElementById("overlayLangZh").classList.toggle("active", locale === "zh-Hant");
        document.getElementById("overlayLangEn").classList.toggle("active", locale === "en");

      function todayISO() {
        var now = new Date();
        var offset = now.getTimezoneOffset() * 60000;
        return new Date(now.getTime() - offset).toISOString().slice(0, 10);
      }

      function viewDate() {
        var el = document.getElementById("todayDate");
        var val = el && el.value ? String(el.value) : todayViewDate;
        if (/^\d{4}-\d{2}-\d{2}$/.test(val)) return val;
        return todayISO();

      function parseNumber(value) {
        return Number(String(value).trim().replace(",", "."));
      }

      function uid() {
        try {
          if (crypto && crypto.randomUUID) return crypto.randomUUID();
        } catch (err) {}
        return String(Date.now()) + "-" + Math.random().toString(16).slice(2);
      }

      function loadSets() {
        try {
          var raw = storageRead(STORAGE_KEY, LEGACY_STORAGE_KEY);
          if (raw) {
            var parsed = JSON.parse(raw);
            if (Array.isArray(parsed)) {
              memoryStore.sets = parsed;
              return parsed.slice();
            }
          }
        } catch (err) {
          if (!persistWarningShown) {
            persistWarningShown = true;
            showStatus("warn", t("persistWarn"));
          }
        }
        return memoryStore.sets.slice();
      }

      function saveSets(sets) {
        memoryStore.sets = sets.slice();
        try {
          var payload = JSON.stringify(sets);
          localStorage.setItem(STORAGE_KEY, payload);
          if (localStorage.getItem(STORAGE_KEY) !== payload) throw new Error("storage verify failed");
          return true;
        } catch (err) {
          showStatus("warn", t("tabOnly"));
          return false;
        }
      }

      function normalizeSet(raw, index) {
        if (!raw || typeof raw !== "object") return null;
        var exercise = String(raw.exercise || raw.name || raw.Exercise || "").trim();
        var weight = parseNumber(raw.weight != null ? raw.weight : raw.Weight);
        var reps = parseNumber(raw.reps != null ? raw.reps : raw.Reps);
        var date = String(raw.date || raw.Date || todayISO()).slice(0, 10);
        if (!exercise || !isFinite(weight) || weight < 0 || !isFinite(reps) || reps < 1) return null;
        return {
          id: String(raw.id || uid() + "-" + index),
          exercise: exercise,
          weight: weight,
          reps: Math.floor(reps),
          date: /^\d{4}-\d{2}-\d{2}$/.test(date) ? date : todayISO(),
          createdAt: Number(raw.createdAt) || Date.now() + index
        };
      }

      function parseBackup(text) {
        var trimmed = String(text || "").replace(/^\uFEFF/, "").trim();
        if (!trimmed) throw new Error("emptyFile");

        if (trimmed.charAt(0) === "{" || trimmed.charAt(0) === "[") {
          var data = JSON.parse(trimmed);
          var rows = Array.isArray(data) ? data : (data.sets || data.records || data.data);
          if (!Array.isArray(rows)) throw new Error("noSetList");
          return rows.map(normalizeSet).filter(Boolean);
        }

        var lines = trimmed.split(/\r?\n/).filter(function (line) { return line.trim(); });
        if (!lines.length) throw new Error("emptyFile");
        var header = lines[0].split(",").map(function (cell) {
          return cell.trim().replace(/^"|"$/g, "").toLowerCase();
        });
        var idx = {
          exercise: header.indexOf("exercise"),
          weight: header.indexOf("weight"),
          reps: header.indexOf("reps"),
          date: header.indexOf("date")
        };
        if (idx.exercise === -1 || idx.weight === -1 || idx.reps === -1) {
          throw new Error("csvNeed");
        }
        return lines.slice(1).map(function (line, index) {
          var cells = line.split(",").map(function (cell) {
            return cell.trim().replace(/^"|"$/g, "");
          });
          return normalizeSet({
            exercise: cells[idx.exercise],
            weight: cells[idx.weight],
            reps: cells[idx.reps],
            date: idx.date >= 0 ? cells[idx.date] : todayISO()
          }, index);
        }).filter(Boolean);
      }

      function backupFilename() {
        return "workout-tracker-web-app-" + todayISO() + ".json";
      }

      function backupPayload() {
        return JSON.stringify({
          app: "workout-tracker-web-app",
          version: 1,
          weightUnit: "kg",
          exportedAt: new Date().toISOString(),
          sets: loadSets()
        }, null, 2);
      }

      function makeBackupFile(text, filename) {
        var bytes = new Blob([text], { type: "application/json" });
        try {
          return new File([bytes], filename, { type: "application/json", lastModified: Date.now() });
        } catch (err) {
          return bytes;
        }
      }

      function isAppleTouch() {
        var ua = String(navigator.userAgent || "");
        if (/iPad|iPhone|iPod/.test(ua)) return true;
        return navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1;
      }

      function downloadJsonFile(file, filename) {
        var url = URL.createObjectURL(file);
        var link = document.createElement("a");
        link.href = url;
        link.download = filename;
        link.target = "_blank";
        link.rel = "noopener";
        link.style.display = "none";
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
      }

      async function exportBackup() {
        var sets = loadSets();
        if (!sets.length) {
          showStatus("err", t("nothingToSave"));
          return;
        }
        var text = backupPayload();
        var filename = backupFilename();
        var file = makeBackupFile(text, filename);

        try {
          if (navigator.share && file && file.name && navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({ files: [file] });
            showStatus("ok", t("savedShare", { count: sets.length }));
            return;
          }
        } catch (err) {
          if (err && err.name === "AbortError") return;
        }

        if (!isAppleTouch()) {
          try {
            if (window.showSaveFilePicker) {
              var handle = await window.showSaveFilePicker({
                suggestedName: filename,
                excludeAcceptAllOption: true,
                types: [
                  {
                    description: "JSON",
                    accept: { "application/json": [".json"] }
                  }
                ]
              });
              var writable = await handle.createWritable();
              await writable.write(file);
              await writable.close();
              showStatus("ok", t("exported", { count: sets.length, filename: filename }));
              return;
            }
          } catch (err) {
            if (err && err.name === "AbortError") return;
          }
        }

        try {
          downloadJsonFile(file, filename);
          showStatus("ok", t("exported", { count: sets.length, filename: filename }));
        } catch (err) {
          try {
            await navigator.clipboard.writeText(text);
            showStatus("ok", t("copied"));
          } catch (clipErr) {
            showStatus("err", t("exportFail"));
          }
        }
      }

      function importBackupText(text) {
        var incoming = parseBackup(text);
        if (!incoming.length) throw new Error("noValidSets");
        var current = loadSets();
        if (current.length) {
          var replace = confirm(t("loadReplace", { incoming: incoming.length, current: current.length }));
          if (replace) {
            saveSets(incoming);
            showStatus("ok", t("loaded", { count: incoming.length }));
          } else {
            var seen = {};
            current.forEach(function (set) { seen[set.id] = true; });
            var merged = current.slice();
            incoming.forEach(function (set) {
              if (seen[set.id]) set.id = uid();
              merged.push(set);
            });
            saveSets(merged);
            showStatus("ok", t("merged", { incoming: incoming.length, total: merged.length }));
          }
        } else {
          saveSets(incoming);
          showStatus("ok", t("loaded", { count: incoming.length }));
        }
        render();
      }

      function setRowHtml(set) {
        return "<div class=\"set-row d-flex justify-content-between align-items-center gap-3 mb-2\">" +
          "<div><div class=\"fw-semibold\">" + escapeHtml(set.exercise) + "</div>" +
          "<div class=\"small text-muted-2\">" + formatWeight(set.weight) + " " + escapeHtml(unitLabel()) + " × " + set.reps + " " + escapeHtml(t("reps")) + " · " +
          formatVolume(Number(set.weight) * Number(set.reps)) + " " + escapeHtml(t("vol")) + "</div></div>" +
          "<div class=\"btn-group\">" +
            "<button class=\"btn btn-ghost btn-sm\" data-edit=\"" + set.id + "\" type=\"button\" aria-label=\"" + escapeHtml(t("editSet")) + "\"><i class=\"bi bi-pencil\"></i></button>" +
            "<button class=\"btn btn-ghost btn-sm text-danger\" data-delete=\"" + set.id + "\" type=\"button\" aria-label=\"" + escapeHtml(t("clear")) + "\"><i class=\"bi bi-x-lg\"></i></button>" +
          "</div></div>";
      }

      function uniqueExercises(sets) {
        var seen = [];
        for (var i = 0; i < sets.length; i++) {
          var name = String(sets[i].exercise || "").trim();
          if (name && !seen.some(function (item) { return item.toLowerCase() === name.toLowerCase(); })) {
            seen.push(name);
          }
        }
        return seen.sort(function (a, b) { return a.localeCompare(b, dateLocaleName()); });
      }

      function formatDateLabel(iso) {
        if (iso === todayISO()) return t("today");
        return new Date(iso + "T00:00:00").toLocaleDateString(dateLocaleName(), {
          weekday: "short", month: "short", day: "numeric"
        });
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "\u0026amp;")
          .replace(/</g, "\u0026lt;")
          .replace(/>/g, "\u0026gt;")
          .replace(/"/g, "\u0026quot;");
      }

      function shiftISO(iso, days) {
        var date = new Date(iso + "T00:00:00");
        date.setDate(date.getDate() + days);
        var offset = date.getTimezoneOffset() * 60000;
        return new Date(date.getTime() - offset).toISOString().slice(0, 10);
      }

      function setBounds(sets) {
        var dates = sets.map(function (set) { return set.date; }).filter(Boolean).sort();
        var min = dates[0] || todayISO();
        var max = dates.length ? dates[dates.length - 1] : todayISO();
        var fromEl = document.getElementById("chartFrom");
        var toEl = document.getElementById("chartTo");
        fromEl.min = min;
        fromEl.max = max;
        toEl.min = min;
        toEl.max = max;
        return { min: min, max: max };
      }

      function applyChartPreset(preset, sets) {
        var bounds = setBounds(sets);
        var fromEl = document.getElementById("chartFrom");
        var toEl = document.getElementById("chartTo");
        var today = todayISO();
        if (preset === "7" || preset === "30" || preset === "90") {
          fromEl.value = shiftISO(today, 1 - Number(preset));
          toEl.value = today;
          return;
        }
        if (preset === "custom") {
          if (!fromEl.value) fromEl.value = bounds.min;
          if (!toEl.value) toEl.value = bounds.max;
          return;
        }
        fromEl.value = bounds.min;
        toEl.value = bounds.max;
      }

      function chartRangeSets(sets) {
        var from = document.getElementById("chartFrom").value;
        var to = document.getElementById("chartTo").value;
        if (from && to && from > to) {
          var swap = from;
          from = to;
          to = swap;
          document.getElementById("chartFrom").value = from;
          document.getElementById("chartTo").value = to;
        }
        return sets.filter(function (set) {
          if (from && set.date < from) return false;
          if (to && set.date > to) return false;
          return true;
        });
      }

      function exerciseProgress(sets) {
        var byName = {};
        sets.forEach(function (set) {
          var name = String(set.exercise || "").trim();
          if (!name) return;
          var key = name.toLowerCase();
          if (!byName[key]) byName[key] = { name: name, days: {} };
          var day = byName[key].days[set.date] || { weight: 0, volume: 0, sets: 0 };
          day.weight = Math.max(day.weight, Number(set.weight) || 0);
          day.volume += (Number(set.weight) || 0) * (Number(set.reps) || 0);
          day.sets += 1;
          byName[key].days[set.date] = day;
        });
        return Object.keys(byName).sort(function (a, b) {
          return byName[a].name.localeCompare(byName[b].name, dateLocaleName());
        }).map(function (key) {
          var item = byName[key];
          var dates = Object.keys(item.days).sort();
          return {
            name: item.name,
            dates: dates,
            labels: dates.map(formatDateLabel),
            weights: dates.map(function (d) { return item.days[d].weight; }),
            volumes: dates.map(function (d) { return item.days[d].volume; })
          };
        });
      }

      function destroyCharts() {
        chartInstances.forEach(function (chart) {
          try { chart.destroy(); } catch (err) {}
        });
        chartInstances = [];
      }

      function chartOptions(series) {
        return {
          chart: {
            type: "line",
            height: 240,
            background: "transparent",
            toolbar: { show: false },
            zoom: { enabled: false },
            fontFamily: "Noto Sans TC, PingFang TC, Microsoft JhengHei, Segoe UI, sans-serif",
            animations: { enabled: true, speed: 400 }
          },
          theme: { mode: "dark" },
          colors: ["#3dff9a", "#2bd4ff"],
          stroke: { width: [3, 2], curve: "smooth" },
          markers: { size: 4, strokeWidth: 0 },
          dataLabels: { enabled: false },
          grid: { borderColor: "#243140", strokeDashArray: 4 },
          legend: { labels: { colors: "#8b9bb0" } },
          xaxis: {
            categories: series.labels,
            labels: { style: { colors: "#8b9bb0" }, rotateAlways: false },
            axisBorder: { color: "#243140" },
            axisTicks: { color: "#243140" }
          },
          yaxis: [
            {
              title: { text: t("chartWeight") + " (" + unitLabel() + ")", style: { color: "#8b9bb0" } },
              labels: { style: { colors: "#8b9bb0" } }
            },
            {
              opposite: true,
              title: { text: t("chartVolume"), style: { color: "#8b9bb0" } },
              labels: { style: { colors: "#8b9bb0" } }
            }
          ],
          tooltip: { theme: "dark", shared: true },
          series: [
            { name: t("chartWeight"), type: "line", data: series.weights.map(function (kg) { return round1(fromKg(kg)); }) },
            { name: t("chartVolume"), type: "area", data: series.volumes.map(function (kgVol) { return round1(fromKg(kgVol)); }) }
          ]
        };
      }

      function previousExerciseVolume(sets, name, day) {
        var key = String(name || "").trim().toLowerCase();
        if (!key) return null;
        var byDate = {};
        sets.forEach(function (set) {
          if (String(set.exercise || "").trim().toLowerCase() !== key) return;
          if (!set.date || set.date >= day) return;
          byDate[set.date] = (byDate[set.date] || 0) + (Number(set.weight) || 0) * (Number(set.reps) || 0);
        });
        var dates = Object.keys(byDate).sort();
        if (!dates.length) return null;
        return byDate[dates[dates.length - 1]];
      }

      function volumeChangePct(nowVol, prevVol) {
        if (prevVol == null || !isFinite(prevVol) || prevVol <= 0) return null;
        return ((nowVol - prevVol) / prevVol) * 100;
      }

      function formatDelta(pct) {
        if (pct == null || !isFinite(pct)) return t("firstSession");
        var rounded = Math.round(pct);
        if (rounded === 0) return "0%";
        return (rounded > 0 ? "+" : "") + rounded + "%";
      }

      function todayPieSeries(sets) {
        var day = viewDate();
        var byName = {};
        sets.forEach(function (set) {
          if (set.date !== day) return;
          var name = String(set.exercise || "").trim();
          if (!name) return;
          var key = name.toLowerCase();
          if (!byName[key]) byName[key] = { name: name, volume: 0, sets: 0 };
          byName[key].volume += (Number(set.weight) || 0) * (Number(set.reps) || 0);
          byName[key].sets += 1;
        });
        return Object.keys(byName).sort(function (a, b) {
          return byName[b].volume - byName[a].volume;
        }).map(function (key) {
          var row = byName[key];
          row.prevVolume = previousExerciseVolume(sets, row.name, day);
          row.changePct = volumeChangePct(row.volume, row.prevVolume);
          return row;
        });
      }

      function pieOptions(rows) {
        return {
          chart: {
            type: "pie",
            height: 280,
            background: "transparent",
            toolbar: { show: false },
            fontFamily: "Noto Sans TC, PingFang TC, Microsoft JhengHei, Segoe UI, sans-serif",
            animations: { enabled: true, speed: 400 }
          },
          theme: { mode: "dark" },
          colors: ["#3dff9a", "#2bd4ff", "#ffc857", "#ff5d73", "#c084fc", "#fb923c", "#67e8f9", "#f472b6"],
          labels: rows.map(function (row) { return row.name; }),
          series: rows.map(function (row) { return round1(fromKg(row.volume)); }),
          legend: {
            position: "bottom",
            labels: { colors: "#8b9bb0" }
          },
          stroke: { width: 0 },
          dataLabels: {
            enabled: true,
            style: { fontSize: "12px", fontWeight: 700 }
          },
          tooltip: {
            theme: "dark",
            y: {
              formatter: function (value, opts) {
                var row = rows[opts.seriesIndex];
                return formatVolume(row.volume) + " " + t("vol") + " · " + row.sets + " " + t("sets");
              }
            }
          }
        };
      }

      function renderTodayPie(sets) {
        var mount = document.getElementById("todayPieMount");
        if (!mount) return;
        var rows = todayPieSeries(sets);
        if (!rows.length) {
          mount.innerHTML = "<div class=\"empty-state\">" + escapeHtml(t("todayPieEmpty")) + "</div>";
          return;
        }
        if (typeof ApexCharts === "undefined") {
          mount.innerHTML = "<div class=\"empty-state\">" + escapeHtml(t("chartsFail")) + "</div>";
          return;
        }
        mount.innerHTML = "";
        var chart = new ApexCharts(mount, pieOptions(rows));
        chart.render();
        chartInstances.push(chart);
      }

      function renderCharts(sets) {
        var list = document.getElementById("chartsList");
        destroyCharts();
        renderTodayPie(sets);
        var preset = document.getElementById("chartRangePreset").value || "7";
        if (!document.getElementById("chartFrom").value || !document.getElementById("chartTo").value) {
          applyChartPreset(preset, sets);
        } else {
          setBounds(sets);
        }
        var ranged = chartRangeSets(sets);
        var progress = exerciseProgress(ranged);
        if (!progress.length) {
          list.innerHTML = "<div class=\"empty-state\">" + escapeHtml(sets.length ? t("chartsEmptyRange") : t("chartsEmpty")) + "</div>";
          return;
        }
        if (typeof ApexCharts === "undefined") {
          list.innerHTML = "<div class=\"empty-state\">" + escapeHtml(t("chartsFail")) + "</div>";
          return;
        }
        list.innerHTML = progress.map(function (item, index) {
          return "<div class=\"chart-card\"><h3>" + escapeHtml(item.name) + "</h3><div class=\"chart-mount\" id=\"chart-" + index + "\"></div></div>";
        }).join("");
        progress.forEach(function (item, index) {
          var chart = new ApexCharts(document.getElementById("chart-" + index), chartOptions(item));
          chart.render();
          chartInstances.push(chart);
        });
      }
      function render() {
        var sets = loadSets().sort(function (a, b) {
          if (a.date === b.date) return (b.createdAt || 0) - (a.createdAt || 0);
          return a.date < b.date ? 1 : -1;
        });

        var day = viewDate();
        var todayDateEl = document.getElementById("todayDate");
        if (todayDateEl && todayDateEl.value !== day) todayDateEl.value = day;
        todayViewDate = day;

        var todaySets = sets.filter(function (set) { return set.date === day; });
        var volume = todaySets.reduce(function (sum, set) {
          return sum + (Number(set.weight) * Number(set.reps));
        }, 0);
        var exercisesToday = {};
        todaySets.forEach(function (set) { exercisesToday[String(set.exercise).toLowerCase()] = true; });

        document.getElementById("statSets").textContent = String(todaySets.length);
        document.getElementById("statVolume").textContent = formatVolume(volume);
        document.getElementById("statExercises").textContent = String(Object.keys(exercisesToday).length);

        var summary = document.getElementById("todaySummary");
        if (summary) {
          var rows = todayPieSeries(sets);
          summary.innerHTML = rows.length
            ? rows.map(function (row) {
                var deltaClass = row.changePct == null ? "delta-flat" : (row.changePct > 0 ? "delta-up" : (row.changePct < 0 ? "delta-down" : "delta-flat"));
                return "<div class=\"set-row summary-row\">" +
                  "<div class=\"d-flex justify-content-between align-items-start gap-2\">" +
                  "<div><div class=\"fw-semibold\">" + escapeHtml(row.name) + "</div>" +
                  "<div class=\"small text-muted-2\">" + row.sets + " " + escapeHtml(t("sets")) + "</div></div>" +
                  "<div class=\"delta-pill " + deltaClass + "\">" + escapeHtml(formatDelta(row.changePct)) + "</div>" +
                  "</div>" +
                  "<div class=\"summary-compare\">" +
                  "<div class=\"summary-compare-cell\"><div class=\"summary-compare-label\">" + escapeHtml(t("volNow")) + "</div>" +
                  "<div class=\"summary-compare-value\">" + formatVolume(row.volume) + "</div></div>" +
                  "<div class=\"summary-compare-cell\"><div class=\"summary-compare-label\">" + escapeHtml(t("volLast")) + "</div>" +
                  "<div class=\"summary-compare-value\">" + (row.prevVolume != null ? formatVolume(row.prevVolume) : "—") + "</div></div>" +
                  "</div></div>";
              }).join("")
            : "<div class=\"empty-state\">" + escapeHtml(t("todayPieEmpty")) + "</div>";
        }

        var todayLog = document.getElementById("todayLog");
        if (todayLog) {
          todayLog.innerHTML = todaySets.length
            ? todaySets.map(setRowHtml).join("")
            : "<div class=\"empty-state\">" + escapeHtml(t("todayPieEmpty")) + "</div>";
        }

        var names = uniqueExercises(sets);
        exerciseList.innerHTML = names.map(function (name) {
          return "<option value=\"" + escapeHtml(name) + "\"></option>";
        }).join("");
        exerciseChips.innerHTML = names.slice(0, 20).map(function (name) {
          return "<button type=\"button\" class=\"chip\" data-exercise=\"" + escapeHtml(name) + "\">" + escapeHtml(name) + "</button>";
        }).join("") || "<span class=\"text-muted-2 small\">" + escapeHtml(t("noRecent")) + "</span>";
        var lastBtn = document.getElementById("lastSetBtn");
        if (lastBtn) lastBtn.disabled = !sets.length;

        var dates = [];
        sets.forEach(function (set) {
          if (dates.indexOf(set.date) === -1) dates.push(set.date);
        });
        dates.sort(function (a, b) { return a < b ? 1 : a > b ? -1 : 0; });
        var today = todayISO();
        if (dates.indexOf(today) === -1) dates.unshift(today);
        if (!logFilter || logFilter === "today") logFilter = today;
        if (logFilter !== "all" && dates.indexOf(logFilter) === -1) logFilter = today;
        filterDate.innerHTML = "<option value=\"" + today + "\">" + escapeHtml(t("today")) + "</option>" +
          "<option value=\"all\">" + escapeHtml(t("allSessions")) + "</option>" +
          dates.filter(function (date) { return date !== today; }).map(function (date) {
            return "<option value=\"" + date + "\">" + escapeHtml(formatDateLabel(date)) + "</option>";
          }).join("");
        filterDate.value = logFilter;
        if (filterDate.value !== logFilter) {
          filterDate.selectedIndex = logFilter === "all" ? 1 : 0;
          logFilter = filterDate.value || today;
        }

        var visible = filterDate.value === "all" ? sets : sets.filter(function (set) {
          return set.date === filterDate.value;
        });

        if (!visible.length) {
          var emptyMsg = filterDate.value === today ? t("todayPieEmpty") : t("emptyLog");
          logList.innerHTML = "<div class=\"empty-state\"><i class=\"bi bi-activity fs-2 d-block mb-2\"></i>" + escapeHtml(emptyMsg) + "</div>";
        } else {
        var grouped = {};
        visible.forEach(function (set) {
          (grouped[set.date] || (grouped[set.date] = [])).push(set);
        });
        var groupDates = Object.keys(grouped).sort(function (a, b) {
          return a < b ? 1 : a > b ? -1 : 0;
        });

        logList.innerHTML = groupDates.map(function (date) {
          var rows = grouped[date].map(setRowHtml).join("");

          var sessionVolume = grouped[date].reduce(function (sum, set) {
            return sum + Number(set.weight) * Number(set.reps);
          }, 0);
          return "<div class=\"mb-4\"><div class=\"d-flex justify-content-between align-items-center mb-2\">" +
            "<strong>" + escapeHtml(formatDateLabel(date)) + "</strong>" +
            "<span class=\"small text-muted-2\">" + grouped[date].length + " " + escapeHtml(t("sets")) + " · " + formatVolume(sessionVolume) + " " + escapeHtml(t("vol")) + "</span>" +
            "</div>" + rows + "</div>";
        }).join("");
        }

        renderCharts(sets);
      }

      document.getElementById("sessionDate").value = todayISO();
      document.getElementById("todayDate").value = todayISO();
      todayViewDate = todayISO();

      function lastAddedSet() {
        var sets = loadSets();
        if (!sets.length) return null;
        return sets.slice().sort(function (a, b) {
          return (Number(b.createdAt) || 0) - (Number(a.createdAt) || 0);
        })[0];
      }

      function logSetValues(exercise, enteredWeight, reps, date, clearReps) {
        var weight = toKg(enteredWeight);
        if (!exercise) {
          showStatus("err", t("needExercise"));
          document.getElementById("exercise").focus();
          return false;
        }
        if (!isFinite(enteredWeight) || enteredWeight < 0) {
          showStatus("err", t("needWeight"));
          document.getElementById("weight").focus();
          return false;
        }
        if (!isFinite(reps) || reps < 1 || Math.floor(reps) !== reps) {
          showStatus("err", t("needReps"));
          document.getElementById("reps").focus();
          return false;
        }
        date = date || todayISO();
        var sets = loadSets();
        sets.push({
          id: uid(),
          exercise: exercise,
          weight: weight,
          reps: reps,
          date: date,
          createdAt: Date.now()
        });
        var persisted = saveSets(sets);
        if (clearReps) document.getElementById("reps").value = "";
        document.getElementById("sessionDate").value = date;
        if (persisted) {
          showStatus("ok", t("logged", { exercise: exercise, weight: round1(enteredWeight), reps: reps, unit: unitLabel() }));
        }
        flashAddSetSuccess();
        render();
        document.getElementById("reps").focus();
        return true;
      }

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        logSetValues(
          document.getElementById("exercise").value.trim(),
          parseNumber(document.getElementById("weight").value),
          parseNumber(document.getElementById("reps").value),
          document.getElementById("sessionDate").value || todayISO(),
          true
        );
      });

      document.getElementById("lastSetBtn").addEventListener("click", function () {
        var last = lastAddedSet();
        if (!last) {
          showStatus("err", t("noLastSet"));
          return;
        }
        var date = document.getElementById("sessionDate").value || last.date || todayISO();
        var shownWeight = fromKg(Number(last.weight) || 0);
        document.getElementById("exercise").value = last.exercise;
        document.getElementById("weight").value = String(round1(shownWeight));
        document.getElementById("reps").value = String(last.reps);
        document.getElementById("sessionDate").value = date;
        logSetValues(last.exercise, shownWeight, Number(last.reps), date, false);
      });

      exerciseChips.addEventListener("click", function (event) {
        var button = event.target.closest("[data-exercise]");
        if (!button) return;
        document.getElementById("exercise").value = button.getAttribute("data-exercise");
        document.getElementById("weight").focus();
      });

      function handleLogClick(event) {
        var deleteBtn = event.target.closest("[data-delete]");
        var editBtn = event.target.closest("[data-edit]");
        var sets = loadSets();

        if (deleteBtn) {
          saveSets(sets.filter(function (set) {
            return set.id !== deleteBtn.getAttribute("data-delete");
          }));
          render();
          return;
        }

        if (editBtn) {
          var set = sets.filter(function (item) {
            return item.id === editBtn.getAttribute("data-edit");
          })[0];
          if (!set) return;
          document.getElementById("editId").value = set.id;
          document.getElementById("editExercise").value = set.exercise;
          document.getElementById("editWeight").value = formatWeight(set.weight);
          document.getElementById("editReps").value = set.reps;
          var editModal = getModal("editModal");
          if (editModal) editModal.show();
          else alert(t("editOnline"));
        }
      }

      logList.addEventListener("click", handleLogClick);
      document.getElementById("todayLog").addEventListener("click", handleLogClick);

      editForm.addEventListener("submit", function (event) {
        event.preventDefault();
        var id = document.getElementById("editId").value;
        var enteredWeight = parseNumber(document.getElementById("editWeight").value);
        var weight = toKg(enteredWeight);
        var reps = parseNumber(document.getElementById("editReps").value);
        var exercise = document.getElementById("editExercise").value.trim();
        if (!exercise || !isFinite(enteredWeight) || enteredWeight < 0 || !isFinite(reps) || reps < 1) {
          alert(t("invalidEdit"));
          return;
        }
        var sets = loadSets().map(function (set) {
          if (set.id !== id) return set;
          return { id: set.id, exercise: exercise, weight: weight, reps: reps, date: set.date, createdAt: set.createdAt };
        });
        saveSets(sets);
        var editModal = getModal("editModal");
        if (editModal) editModal.hide();
        render();
      });

      filterDate.addEventListener("change", function () {
        logFilter = filterDate.value;
        render();
      });
      document.getElementById("todayDate").addEventListener("change", function () {
        todayViewDate = viewDate();
        render();
      });
      document.getElementById("formStatusClose").addEventListener("click", hideStatus);

      document.getElementById("chartRangePreset").addEventListener("change", function () {
        applyChartPreset(document.getElementById("chartRangePreset").value, loadSets());
        renderCharts(loadSets());
      });
      document.getElementById("chartFrom").addEventListener("change", function () {
        document.getElementById("chartRangePreset").value = "custom";
        renderCharts(loadSets());
      });
      document.getElementById("chartTo").addEventListener("change", function () {
        document.getElementById("chartRangePreset").value = "custom";
        renderCharts(loadSets());
      });

      document.getElementById("saveBtn").addEventListener("click", function () {
        exportBackup();
      });

      document.getElementById("loadBtn").addEventListener("click", function () {
        loadFile.value = "";
        loadFile.click();
      });

      loadFile.addEventListener("change", function (event) {
        var file = event.target.files && event.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function () {
          try {
            importBackupText(String(reader.result || ""));
          } catch (err) {
            var code = err && err.message;
            showStatus("err", t(code) !== code ? t(code) : t("readFail"));
          }
        };
        reader.onerror = function () {
          showStatus("err", t("openFail"));
        };
        reader.readAsText(file);
      });

      function showClearPrompt() {
        document.getElementById("clearPrompt").classList.remove("hidden");
        document.body.classList.add("welcome-lock");
      }

      function hideClearPrompt() {
        document.getElementById("clearPrompt").classList.add("hidden");
        if (document.getElementById("welcomeOverlay").classList.contains("hidden")) {
          document.body.classList.remove("welcome-lock");
        }
      }

      function doClearAll() {
        saveSets([]);
        render();
        showStatus("ok", t("cleared"));
        hideClearPrompt();
      }

      document.getElementById("clearAllBtn").addEventListener("click", function () {
        showClearPrompt();
      });

      document.getElementById("clearConfirmBtn").addEventListener("click", function () {
        doClearAll();
      });

      document.getElementById("clearCancelBtn").addEventListener("click", function () {
        hideClearPrompt();
      });

      document.getElementById("langZh").addEventListener("click", function () { setLocale("zh-Hant"); });
      document.getElementById("langEn").addEventListener("click", function () { setLocale("en"); });
      document.getElementById("overlayLangZh").addEventListener("click", function () { setLocale("zh-Hant"); });
      document.getElementById("overlayLangEn").addEventListener("click", function () { setLocale("en"); });
      document.getElementById("unitKg").addEventListener("click", function () { setUnit("kg"); });
      document.getElementById("unitLbs").addEventListener("click", function () { setUnit("lbs"); });
      document.getElementById("formUnitKg").addEventListener("click", function () { setUnit("kg"); });
      document.getElementById("formUnitLbs").addEventListener("click", function () { setUnit("lbs"); });

      document.getElementById("tab-charts-btn").addEventListener("shown.bs.tab", function () {
        renderCharts(loadSets());
      });
      document.getElementById("tab-today-btn").addEventListener("shown.bs.tab", function () {
        destroyCharts();
        renderTodayPie(loadSets());
      });
      document.getElementById("appTabs").addEventListener("click", function (event) {
        var btn = event.target.closest("[data-bs-target]");
        if (!btn || window.bootstrap) return;
        var target = document.querySelector(btn.getAttribute("data-bs-target"));
        if (!target) return;
        document.querySelectorAll("#appTabs .nav-link").forEach(function (link) {
          link.classList.toggle("active", link === btn);
          link.setAttribute("aria-selected", link === btn ? "true" : "false");
        });
        document.querySelectorAll(".tab-pane").forEach(function (pane) {
          var on = pane === target;
          pane.classList.toggle("show", on);
          pane.classList.toggle("active", on);
        });
        if (target.id === "tab-charts") renderCharts(loadSets());
        if (target.id === "tab-today") {
          destroyCharts();
          renderTodayPie(loadSets());
        }
      });

      function hasMadeFirstChoice() {
        return storageRead(FIRST_OPEN_KEY, LEGACY_FIRST_OPEN_KEY) === "1";
      }

      function markFirstChoice() {
        try { localStorage.setItem(FIRST_OPEN_KEY, "1"); } catch (err) {}
      }

      function hideWelcome() {
        document.getElementById("welcomeOverlay").classList.add("hidden");
        document.body.classList.remove("welcome-lock");
      }

      function showWelcome() {
        document.getElementById("welcomeOverlay").classList.remove("hidden");
        document.body.classList.add("welcome-lock");
      }

      document.getElementById("welcomeOpenBtn").addEventListener("click", function () {
        markFirstChoice();
        hideWelcome();
        loadFile.value = "";
        loadFile.click();
      });

      document.getElementById("welcomeSkipBtn").addEventListener("click", function () {
        markFirstChoice();
        hideWelcome();
      });

      unit = detectUnit();
      setLocale(detectLocale());
      if (!hasMadeFirstChoice()) showWelcome();

      function isTextField(el) {
        if (!el || el === document.body || el === document.documentElement) return false;
        var tag = (el.tagName || "").toLowerCase();
        if (tag === "textarea") return true;
        if (tag === "select") return true;
        if (tag === "input") {
          var type = String(el.type || "text").toLowerCase();
          return type !== "button" && type !== "submit" && type !== "reset" && type !== "checkbox" && type !== "radio" && type !== "file" && type !== "hidden";
        }
        return !!el.isContentEditable;
      }

      function isKeyboardOpen() {
        if (isTextField(document.activeElement)) return true;
        var vv = window.visualViewport;
        if (!vv) return false;
        var covered = window.innerHeight - vv.height - (vv.offsetTop || 0);
        return covered > 80;
      }

      function syncKeyboardNav() {
        document.body.classList.toggle("keyboard-open", isKeyboardOpen());
      }

      document.addEventListener("focusin", syncKeyboardNav);
      document.addEventListener("focusout", function () {
        setTimeout(syncKeyboardNav, 50);
      });
      window.addEventListener("resize", syncKeyboardNav);
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", syncKeyboardNav);
        window.visualViewport.addEventListener("scroll", syncKeyboardNav);
      }

      if (window.location.protocol !== "file:" && "serviceWorker" in navigator) {
        navigator.serviceWorker.register("./sw.js").catch(function () {});
      }
    })();
  </script>
</body>
</html>
